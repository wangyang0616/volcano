                          this never move.'
                        format: int32
                        type: integer
                      maxMovesPerJob:
                        description: MaxMovesPerJob caps relocations of any single
                          PodGroup.
                        format: int32
                        minimum: 0
                        type: integer
                    type: object
                  lambda:
                    description: Lambda is the benefit-vs-friction trade-off as an
                      integer weight (default 1).
                    format: int32
                    minimum: 0
                    type: integer
                  maxDisruptionScore:
                    description: MaxDisruptionScore is the disruption-cost red line.
                    format: int32
                    minimum: 0
                    type: integer
                  minRunDuration:
                    description: 'MinRunDuration: jobs running less than this are
                      not moved.'
                    type: string
                  respectPDB:
                    description: RespectPDB enables PodDisruptionBudget compatibility.
                    type: boolean
                  weights:
                    additionalProperties:
                      format: int32
                      type: integer
                    description: |-
