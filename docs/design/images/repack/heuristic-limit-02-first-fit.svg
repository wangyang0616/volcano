<svg viewBox="0 0 1120 500" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" role="img">
  <title>first-fit 占用受限 Pod 的唯一接收节点</title>
  <desc>P1 可放 R1 或 R2，P2 只能放 R1。当前算法先将 P1 放到 R1 后判定失败；全局映射将 P1 放到 R2、P2 放到 R1，完成腾空。</desc>
  <defs><marker id="a2" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#57606a"/></marker></defs>
  <style>.t{fill:#1f2328}.s{fill:#57606a}.box{fill:#fff;stroke:#d0d7de}.cur{fill:#fff4e6;stroke:#e8890c}.opt{fill:#edf9f1;stroke:#2f9e44}.bad{fill:#fff1f0;stroke:#e03131}.arr{fill:none;stroke:#57606a;stroke-width:1.8;marker-end:url(#a2)}text{dominant-baseline:middle}</style>
  <rect width="1120" height="500" fill="#fff"/><text x="32" y="30" class="t" font-size="18" font-weight="700">场景 2 · first-fit 抢占受限 Pod 的唯一落点</text>
  <rect x="32" y="54" width="1056" height="72" rx="10" fill="#f6f8fa" stroke="#d0d7de"/><text x="52" y="76" class="t" font-size="12" font-weight="700">P1：4 卡，可落 R1 / R2　　P2：4 卡，只能落 R1　　R1、R2：各空闲 4 卡</text><text x="52" y="102" class="s" font-size="11">接收节点顺序为 R1 → R2；P1 与 P2 均来自同一个待腾空节点。</text>
  <rect x="32" y="146" width="514" height="270" rx="12" class="cur"/><text x="52" y="170" class="t" font-size="14" font-weight="700">当前算法 · 第一个可行节点即提交</text>
  <rect x="58" y="202" width="92" height="52" rx="8" class="box"/><text x="104" y="228" text-anchor="middle" class="t" font-size="11" font-weight="700">P1 · 灵活</text><path d="M150 228 H208" class="arr"/><rect x="216" y="196" width="100" height="64" rx="8" fill="#e8890c"/><text x="266" y="217" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">R1</text><text x="266" y="239" text-anchor="middle" fill="#fff" font-size="9.5">P1 占满 4 卡</text>
  <rect x="58" y="300" width="92" height="52" rx="8" class="box"/><text x="104" y="326" text-anchor="middle" class="t" font-size="11" font-weight="700">P2 · 受限</text><path d="M150 326 H208" class="arr"/><rect x="216" y="294" width="100" height="64" rx="8" class="bad"/><text x="266" y="315" text-anchor="middle" fill="#e03131" font-size="11" font-weight="700">R1 已满</text><text x="266" y="337" text-anchor="middle" class="s" font-size="9.5">R2 不满足约束</text>
  <path d="M316 326 H392" class="arr"/><rect x="400" y="294" width="116" height="64" rx="8" fill="#e03131"/><text x="458" y="315" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">候选不可行</text><text x="458" y="337" text-anchor="middle" fill="#fff" font-size="9.5">没有回退 P1</text>
  <rect x="574" y="146" width="514" height="270" rx="12" class="opt"/><text x="594" y="170" class="t" font-size="14" font-weight="700">全局最优 · 联合比较两个 Pod 的映射</text>
  <rect x="606" y="204" width="92" height="52" rx="8" class="box"/><text x="652" y="230" text-anchor="middle" class="t" font-size="11" font-weight="700">P1</text><path d="M698 230 H778" class="arr"/><rect x="786" y="198" width="104" height="64" rx="8" class="box"/><text x="838" y="220" text-anchor="middle" class="t" font-size="11" font-weight="700">R2</text><text x="838" y="241" text-anchor="middle" class="s" font-size="9.5">灵活 Pod 让位</text>
  <rect x="606" y="302" width="92" height="52" rx="8" class="box"/><text x="652" y="328" text-anchor="middle" class="t" font-size="11" font-weight="700">P2</text><path d="M698 328 H778" class="arr"/><rect x="786" y="296" width="104" height="64" rx="8" class="box"/><text x="838" y="318" text-anchor="middle" class="t" font-size="11" font-weight="700">R1</text><text x="838" y="339" text-anchor="middle" class="s" font-size="9.5">保留唯一落点</text>
  <path d="M890 279 H956" class="arr"/><rect x="964" y="244" width="96" height="70" rx="8" fill="#2f9e44"/><text x="1012" y="266" text-anchor="middle" fill="#fff" font-size="10" font-weight="700">全部落下</text><text x="1012" y="288" text-anchor="middle" fill="#fff" font-size="10">源节点腾空</text>
  <rect x="32" y="438" width="1056" height="38" rx="8" fill="#f6f8fa" stroke="#d0d7de"/><text x="560" y="457" text-anchor="middle" class="t" font-size="11"><tspan font-weight="700">为什么：</tspan>生产模拟按 victim 顺序做 first-fit；后续失败时不会回溯前一个 Pod 的接收节点。</text>
</svg>
