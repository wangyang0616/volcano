<svg viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" role="img">
  <title>Repack 端到端执行链路</title>
  <desc>用户创建 RepackRun。Repack Engine 基于实时调度快照生成计划；DryRun 仅返回计划，Execute 使用 Eviction API 驱逐 Pod。工作负载控制器重建 Pod，Volcano Controller Manager 内置的 Repack Controller 写入软性提名，Volcano Scheduler 完成最终调度并回写实际落点。</desc>
  <defs>
    <marker id="blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#2563eb"/></marker>
    <marker id="green" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/></marker>
    <style>
      .title{fill:#111827;font-size:20px;font-weight:700}.head{fill:#111827;font-size:14px;font-weight:700}.body{fill:#475569;font-size:11px}.small{fill:#64748b;font-size:10px}.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.card{fill:#fff;stroke:#cbd5e1;stroke-width:1.5}.api{fill:#fff7ed;stroke:#f59e0b;stroke-width:1.6}.engine{fill:#ecfdf5;stroke:#22c55e;stroke-width:1.8}.platform{fill:#eff6ff;stroke:#3b82f6;stroke-width:1.5}.dry{fill:#eff6ff;stroke:#60a5fa;stroke-width:1.5}.exec{fill:#f0fdf4;stroke:#4ade80;stroke-width:1.5}.line{fill:none;stroke:#2563eb;stroke-width:1.8;marker-end:url(#blue)}.eline{fill:none;stroke:#16a34a;stroke-width:1.8;marker-end:url(#green)}.dash{stroke-dasharray:6 5}
    </style>
  </defs>

  <text x="600" y="32" text-anchor="middle" class="title">Repack 端到端执行链路</text>

  <rect x="32" y="92" width="150" height="88" rx="10" class="card"/>
  <text x="107" y="118" text-anchor="middle" class="head">用户 / 运维平台</text>
  <text x="107" y="142" text-anchor="middle" class="body">创建 RepackRun</text>
  <text x="107" y="160" text-anchor="middle" class="small code">DryRun / Execute</text>

  <rect x="234" y="78" width="200" height="116" rx="10" class="api"/>
  <text x="334" y="104" text-anchor="middle" class="head">kube-apiserver</text>
  <text x="334" y="130" text-anchor="middle" class="body code">RepackRun.spec</text>
  <text x="334" y="150" text-anchor="middle" class="body code">plan / relocations / result</text>
  <text x="334" y="172" text-anchor="middle" class="small">持久化事实与执行状态</text>

  <rect x="494" y="66" width="246" height="140" rx="12" class="engine"/>
  <text x="617" y="94" text-anchor="middle" class="head">Repack Engine</text>
  <text x="617" y="120" text-anchor="middle" class="body">实时 Scheduler Session</text>
  <text x="617" y="141" text-anchor="middle" class="body">Action + Plugins + Lazy Planner</text>
  <text x="617" y="162" text-anchor="middle" class="body">过滤 → 评分 → 调度模拟 → 收益门控</text>
  <text x="617" y="184" text-anchor="middle" class="small">不绑定 Pod，不预留目标资源</text>

  <path d="M182 136 H232" class="line"/>
  <text x="207" y="122" text-anchor="middle" class="small">1 创建</text>
  <path d="M434 120 H492" class="line"/>
  <text x="463" y="106" text-anchor="middle" class="small">2 触发</text>
  <path d="M494 174 H436" class="line"/>
  <text x="465" y="193" text-anchor="middle" class="small">3 写计划</text>

  <rect x="92" y="264" width="420" height="122" rx="12" class="dry"/>
  <text x="302" y="292" text-anchor="middle" class="head">DryRun：评估，不产生业务扰动</text>
  <text x="302" y="320" text-anchor="middle" class="body">输出待腾空节点、迁移 Pod、建议接收节点和预期收益</text>
  <text x="302" y="343" text-anchor="middle" class="body">用户确认 Scope、Gang 影响和预算后，再创建 Execute Run</text>
  <text x="302" y="367" text-anchor="middle" class="small">Execute 会基于当时的实时状态重新规划，不复用历史 DryRun 计划</text>
  <path d="M562 206 C520 232 420 236 350 262" class="line"/>

  <rect x="562" y="264" width="606" height="368" rx="14" class="exec"/>
  <text x="865" y="292" text-anchor="middle" class="head">Execute：计划持久化后执行迁移</text>

  <rect x="590" y="322" width="176" height="76" rx="9" class="card"/>
  <text x="678" y="344" text-anchor="middle" class="head">Eviction API</text>
  <text x="678" y="367" text-anchor="middle" class="body">遵守 PDB</text>
  <text x="678" y="384" text-anchor="middle" class="small">记录 eviction journal</text>

  <rect x="804" y="322" width="220" height="76" rx="9" class="card"/>
  <text x="914" y="344" text-anchor="middle" class="head">工作负载控制器</text>
  <text x="914" y="367" text-anchor="middle" class="body">观察删除并重建 Pod</text>
  <text x="914" y="384" text-anchor="middle" class="small">VCJob / ModelServing 等</text>

  <rect x="706" y="444" width="260" height="84" rx="9" class="platform"/>
  <text x="836" y="467" text-anchor="middle" class="head">Volcano Controller Manager</text>
  <text x="836" y="490" text-anchor="middle" class="body">内置 Repack Controller</text>
  <text x="836" y="510" text-anchor="middle" class="small code">placement gate + nominatedNodeName</text>

  <rect x="706" y="558" width="260" height="54" rx="9" class="platform"/>
  <text x="836" y="579" text-anchor="middle" class="head">Volcano Scheduler</text>
  <text x="836" y="598" text-anchor="middle" class="small">统一调度并完成最终绑定</text>

  <rect x="1000" y="444" width="140" height="168" rx="9" class="card"/>
  <text x="1070" y="468" text-anchor="middle" class="head">集群节点</text>
  <rect x="1020" y="490" width="44" height="92" rx="5" fill="#dcfce7" stroke="#22c55e"/>
  <rect x="1078" y="490" width="44" height="92" rx="5" fill="#fff" stroke="#cbd5e1"/>
  <rect x="1025" y="499" width="34" height="76" rx="3" fill="#22c55e" opacity=".75"/>
  <text x="1042" y="598" text-anchor="middle" class="small">承载</text>
  <text x="1100" y="598" text-anchor="middle" class="small">空闲</text>

  <path d="M740 176 C790 210 680 246 678 320" class="eline"/>
  <text x="715" y="244" class="small">4 驱逐</text>
  <path d="M766 360 H802" class="eline"/>
  <text x="784" y="346" text-anchor="middle" class="small">5 重建</text>
  <path d="M914 398 C914 420 872 424 850 442" class="eline"/>
  <text x="930" y="423" class="small">6 认领替身</text>
  <path d="M836 528 V556" class="eline"/>
  <text x="851" y="543" class="small">7 软性牵引</text>
  <path d="M966 585 H998" class="eline"/>
  <text x="982" y="570" text-anchor="middle" class="small">8 绑定</text>
  <path d="M1000 480 H968" class="line dash"/>
  <text x="984" y="464" text-anchor="middle" class="small">9 观察绑定</text>

  <rect x="32" y="666" width="1136" height="1" fill="#e2e8f0"/>
  <text x="600" y="684" text-anchor="middle" class="small">蓝色：状态与控制流　绿色：Execute 迁移链路　提名仅提供调度偏好，资源冲突时不保证落到建议节点</text>
</svg>
