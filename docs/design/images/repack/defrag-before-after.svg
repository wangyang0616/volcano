<svg viewBox="0 0 880 360" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif" role="img">
<title>Repack 整理前后效果对比</title>
<desc>整理前 4 个节点各被小作业占用、剩余碎片；整理后把 3 个作业搬迁填进 N1/N2 空位，N3、N4 整节点腾空，所有作业继续运行。</desc>
