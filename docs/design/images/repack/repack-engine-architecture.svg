<svg viewBox="0 0 1440 930" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" role="img">
  <title>Repack Engine 技术架构：Cache、Session 与 Plugin 扩展</title>
  <desc>Repack Engine 通过独立的只读 Scheduler Cache 获得持续更新的集群视图。每次规划从 Cache 打开 Volcano Scheduler Session，再由 SessionSnapshot 适配为 Repack Snapshot，并创建一次性的 Repack Planning Session。Repack Plugins 在 Session 打开时注册可组合回调，Lazy Drain Planner 消费聚合后的策略，并通过 SessionSnapshot 复用完整 Scheduler 模拟过滤。</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#e2e8f0" stroke-width="1" opacity=".42"/></pattern>
    <marker id="blueArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#2563eb"/></marker>
    <marker id="greenArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/></marker>
    <marker id="orangeArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#f97316"/></marker>
    <style>
      .title{fill:#0f172a;font-size:21px;font-weight:750}.subtitle{fill:#64748b;font-size:11px}.head{fill:#0f172a;font-size:14px;font-weight:700}.subhead{fill:#1e293b;font-size:12px;font-weight:700}.body{fill:#475569;font-size:10.5px}.small{fill:#64748b;font-size:9.5px}.micro{fill:#64748b;font-size:8.5px}.code{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,monospace}.panel{fill:#fff;stroke:#cbd5e1;stroke-width:1.4}.bluePanel{fill:#eff6ff;stroke:#3b82f6;stroke-width:1.7}.greenPanel{fill:#f0fdf4;stroke:#22c55e;stroke-width:1.7}.orangePanel{fill:#fff7ed;stroke:#fb923c;stroke-width:1.6}.slatePanel{fill:#f8fafc;stroke:#94a3b8;stroke-width:1.5}.blueCard{fill:#fff;stroke:#60a5fa;stroke-width:1.25}.greenCard{fill:#fff;stroke:#4ade80;stroke-width:1.25}.orangeCard{fill:#fff;stroke:#fdba74;stroke-width:1.25}.slateCard{fill:#fff;stroke:#cbd5e1;stroke-width:1.2}.badgeBlue{fill:#dbeafe}.badgeGreen{fill:#dcfce7}.badgeOrange{fill:#ffedd5}.badgeSlate{fill:#e2e8f0}.blueText{fill:#1d4ed8}.greenText{fill:#15803d}.orangeText{fill:#c2410c}.line{fill:none;stroke:#2563eb;stroke-width:1.65;marker-end:url(#blueArrow)}.greenLine{fill:none;stroke:#16a34a;stroke-width:1.65;marker-end:url(#greenArrow)}.orangeLine{fill:none;stroke:#f97316;stroke-width:1.65;marker-end:url(#orangeArrow)}.dash{stroke-dasharray:6 5}.step{fill:#fff;stroke:#cbd5e1;stroke-width:1.2}.stepNo{fill:#2563eb}.stepNoText{fill:#fff;font-size:9.5px;font-weight:700}.boundary{fill:#f8fafc;stroke:#e2e8f0;stroke-width:1.2}
    </style>
  </defs>
  <rect width="1440" height="930" fill="#fff"/><rect width="1440" height="930" fill="url(#grid)"/>
  <text x="720" y="34" text-anchor="middle" class="title">Repack Engine 技术架构 · Cache、Session 与 Plugin 扩展</text>
  <text x="720" y="56" text-anchor="middle" class="subtitle">实时集群事实由 Cache 提供；一次规划的隔离视图由双层 Session 建立；场景策略通过回调组合而非侵入 Planner</text>

  <!-- Runtime control plane -->
  <rect x="28" y="78" width="1384" height="106" rx="14" class="bluePanel"/>
  <text x="48" y="98" class="head">Engine Runtime · 事件驱动与业务编排</text>
  <rect x="48" y="112" width="154" height="54" rx="9" class="slateCard"/>
  <text x="125" y="132" text-anchor="middle" class="subhead code">RepackRun</text><text x="125" y="151" text-anchor="middle" class="small">informer → workqueue</text>
  <rect x="246" y="112" width="220" height="54" rx="9" class="blueCard"/>
  <text x="356" y="132" text-anchor="middle" class="subhead">Engine Controller</text><text x="356" y="151" text-anchor="middle" class="small">单 worker · K=1 Execute gate · recovery</text>
  <rect x="510" y="112" width="220" height="54" rx="9" class="greenCard"/>
  <text x="620" y="132" text-anchor="middle" class="subhead code">Action: repack</text><text x="620" y="151" text-anchor="middle" class="small">状态阶段分派 · 唯一业务入口</text>
  <rect x="774" y="112" width="220" height="54" rx="9" class="greenCard"/>
  <text x="884" y="132" text-anchor="middle" class="subhead">OpenPlanningCycle</text><text x="884" y="151" text-anchor="middle" class="small">仅 Planning 阶段创建并按次关闭</text>
  <rect x="1038" y="112" width="178" height="54" rx="9" class="orangeCard"/>
  <text x="1127" y="132" text-anchor="middle" class="subhead">Plan / Report</text><text x="1127" y="151" text-anchor="middle" class="small">DryRun 与 Execute 共用</text>
  <rect x="1260" y="112" width="132" height="54" rx="9" class="orangeCard"/>
  <text x="1326" y="132" text-anchor="middle" class="subhead">Execute</text><text x="1326" y="151" text-anchor="middle" class="small">journal · eviction</text>
  <path d="M202 139H244" class="line"/><path d="M466 139H508" class="line"/><path d="M730 139H772" class="greenLine"/><path d="M994 139H1036" class="greenLine"/><path d="M1216 139H1258" class="orangeLine"/>

  <!-- Scheduler cache and session plane -->
  <rect x="28" y="208" width="362" height="430" rx="14" class="slatePanel"/>
  <text x="209" y="234" text-anchor="middle" class="head">Scheduler Cache 与只读 Session</text>
  <rect x="48" y="252" width="322" height="58" rx="9" class="slateCard"/>
  <text x="209" y="272" text-anchor="middle" class="subhead">Kubernetes / Volcano Informers</text>
  <text x="209" y="293" text-anchor="middle" class="small">Node · Pod · PodGroup · Queue · HyperNode · PDB · 存储拓扑</text>
  <path d="M209 310V326" class="line"/>
  <rect x="48" y="328" width="322" height="66" rx="9" class="blueCard"/>
  <rect x="62" y="340" width="92" height="21" rx="10" class="badgeBlue"/><text x="108" y="351" text-anchor="middle" class="micro blueText code">cache.Cluster</text>
  <text x="62" y="375" class="body code">scheduler/cache.Cache</text><text x="222" y="375" class="small">持续同步 · 只读复用</text>
  <path d="M209 394V410" class="line"/>
  <rect x="48" y="412" width="322" height="126" rx="9" class="blueCard"/>
  <text x="209" y="433" text-anchor="middle" class="subhead">Volcano Scheduler Session</text>
  <text x="209" y="454" text-anchor="middle" class="small code">Cluster.OpenSession(tiers, configurations)</text>
  <text x="62" y="476" class="body">• 从 Cache 克隆 Nodes / Jobs / Queues / HyperNodes</text>
  <text x="62" y="496" class="body">• Planning / live placement / result verification 按需创建</text>
  <text x="62" y="516" class="body">• 打开 Scheduler plugins，初始化 CycleState</text>
  <text x="62" y="530" class="micro code">PrePredicate · SimulateRemove/Add · SimulatePredicate</text>
  <rect x="48" y="554" width="322" height="64" rx="9" class="slateCard"/>
  <text x="209" y="573" text-anchor="middle" class="subhead code">CloseSessionReadOnly</text>
  <text x="209" y="593" text-anchor="middle" class="small">释放 snapshot，不回写 PodGroup / Queue 状态</text>
  <text x="209" y="609" text-anchor="middle" class="micro">避免与真正的 Volcano Scheduler 形成双写竞争</text>

  <!-- Snapshot adapter -->
  <rect x="420" y="208" width="272" height="430" rx="14" class="bluePanel"/>
  <text x="556" y="234" text-anchor="middle" class="head">Snapshot Adapter</text>
  <rect x="440" y="252" width="232" height="70" rx="9" class="blueCard"/>
  <text x="556" y="273" text-anchor="middle" class="subhead code">SessionSnapshot</text>
  <text x="556" y="294" text-anchor="middle" class="small">隔离 Scheduler 实现细节</text><text x="556" y="311" text-anchor="middle" class="micro">实现 framework.Snapshot</text>
  <rect x="440" y="338" width="232" height="122" rx="9" class="slateCard"/>
  <text x="454" y="359" class="subhead">只读事实接口</text>
  <text x="454" y="383" class="body code">Nodes / NodeInScope</text><text x="454" y="403" class="body code">PodGroupView / SubGroupPolicy</text>
  <text x="454" y="423" class="body code">PodDisruptionBudgetReader</text><text x="454" y="446" class="micro">PDB 在 Session 打开时读取并冻结为规划事实</text>
  <rect x="440" y="476" width="232" height="142" rx="9" class="greenCard"/>
  <text x="556" y="497" text-anchor="middle" class="subhead code">FeasibleRelocation</text>
  <text x="454" y="522" class="body">• 克隆 NodeInfo 与 CycleState</text><text x="454" y="543" class="body">• 模拟移除 source victims</text>
  <text x="454" y="564" class="body">• 注入本轮已提交 placements</text><text x="454" y="585" class="body">• FutureIdle + 完整 Predicate 栈</text>
  <text x="454" y="602" class="micro">Planner / live placement 共用</text><text x="454" y="615" class="micro">不修改共享 Scheduler Session</text>

  <!-- Repack planning session -->
  <rect x="722" y="208" width="326" height="430" rx="14" class="greenPanel"/>
  <text x="885" y="234" text-anchor="middle" class="head">Repack Planning Session · 每 Run 一次</text>
  <rect x="742" y="252" width="286" height="82" rx="9" class="greenCard"/>
  <text x="885" y="273" text-anchor="middle" class="subhead">SessionConfig</text>
  <text x="756" y="297" class="small code">Snapshot · Run · Scope · Resource · Mode</text>
  <text x="756" y="316" class="small code">Benefit gates · maxPerRun budgets</text>
  <rect x="742" y="350" width="286" height="198" rx="9" class="slateCard"/>
  <text x="885" y="371" text-anchor="middle" class="subhead">聚合后的策略端口</text>
  <text x="756" y="396" class="body code">MovableFn</text><text x="900" y="396" class="small">AND：任一插件可否决</text>
  <text x="756" y="417" class="body code">DomainFn</text><text x="900" y="417" class="small">UNION：合并 FreeableUnit</text>
  <text x="756" y="438" class="body code">CandidateFilterFn</text><text x="900" y="438" class="small">顺序硬过滤</text>
  <text x="756" y="459" class="body code">DisruptionScoreFn</text><text x="900" y="459" class="small">归一化加权排序</text>
  <text x="756" y="480" class="body code">ReceiverPoolFn</text><text x="900" y="480" class="small">INTERSECTION</text>
  <text x="756" y="501" class="body code">VictimOrderFn</text><text x="900" y="501" class="small">稳定字典序</text>
  <text x="756" y="522" class="body code">ReceiverPreferenceFn</text><text x="900" y="522" class="small">阶段化字典序</text>
  <text x="756" y="540" class="micro code">PlanConstraintFn: all must pass</text>
  <rect x="742" y="564" width="286" height="54" rx="9" class="greenCard"/>
  <text x="885" y="584" text-anchor="middle" class="subhead">生命周期与组合保证</text>
  <text x="885" y="603" text-anchor="middle" class="small">按插件名规范化打开 · capability 校验 · Close</text>

  <!-- Repack plugins -->
  <rect x="1078" y="208" width="334" height="430" rx="14" class="orangePanel"/>
  <text x="1245" y="234" text-anchor="middle" class="head">Repack Plugins · 场景化扩展</text>
  <text x="1245" y="253" text-anchor="middle" class="micro">OnSessionOpen 注册回调；Planner 不依赖具体插件名</text>
  <rect x="1098" y="270" width="294" height="42" rx="8" class="orangeCard"/>
  <text x="1112" y="285" class="small orangeText code">workloadscope</text><text x="1260" y="285" class="micro code">MovableFn</text><text x="1112" y="302" class="micro">限制允许迁移的 PodGroup / workload</text>
  <rect x="1098" y="320" width="294" height="42" rx="8" class="orangeCard"/>
  <text x="1112" y="335" class="small orangeText code">pdbconstraint</text><text x="1260" y="335" class="micro code">MovableFn</text><text x="1112" y="352" class="micro">一次编译零中断 PDB，规划查询 O(1)</text>
  <rect x="1098" y="370" width="294" height="42" rx="8" class="orangeCard"/>
  <text x="1112" y="385" class="small orangeText code">nodeconsolidation</text><text x="1260" y="385" class="micro code">DomainFn</text><text x="1112" y="402" class="micro">提供 node 级 FreeableUnit / domain capability</text>
  <rect x="1098" y="420" width="294" height="42" rx="8" class="orangeCard"/>
  <text x="1112" y="435" class="small orangeText code">repackbudget</text><text x="1260" y="435" class="micro code">CandidateFilter</text><text x="1112" y="452" class="micro">按完整 prospective plan 限制爆炸半径</text>
  <rect x="1098" y="470" width="294" height="42" rx="8" class="orangeCard"/>
  <text x="1112" y="485" class="small orangeText code">workloaddisruption</text><text x="1260" y="485" class="micro code">Score</text><text x="1112" y="502" class="micro">PodGroup 数、迁移资源量、Pod 数</text>
  <rect x="1098" y="520" width="294" height="42" rx="8" class="orangeCard"/>
  <text x="1112" y="535" class="small orangeText code">gangdisruption</text><text x="1260" y="535" class="micro code">Score + Receiver</text><text x="1112" y="552" class="micro">Gang breach、受损资源与未来影响</text>
  <rect x="1098" y="570" width="294" height="42" rx="8" class="orangeCard"/>
  <text x="1112" y="585" class="small orangeText code">binpack</text><text x="1260" y="585" class="micro code">Victim + Receiver</text><text x="1112" y="602" class="micro">大 Pod 优先、稳定优先、best-fit</text>
  <text x="1245" y="625" text-anchor="middle" class="micro">未来 HyperNode / 新约束 / 新偏好复用同一组扩展点</text>

  <!-- Cross-layer relationships -->
  <path d="M390 434H418" class="line"/><text x="404" y="421" text-anchor="middle" class="micro blueText">adapt</text>
  <path d="M692 292H720" class="greenLine"/><text x="706" y="279" text-anchor="middle" class="micro greenText">Snapshot</text>
  <path d="M1078 398H1050" class="orangeLine"/><text x="1064" y="384" text-anchor="middle" class="micro orangeText">register</text>
  <path d="M885 638V662" class="greenLine"/><text x="900" y="651" class="micro greenText">consume</text>
  <path d="M884 184V206" class="greenLine"/><text x="901" y="196" class="micro greenText">open</text>

  <!-- Planner pipeline -->
  <rect x="28" y="668" width="1384" height="170" rx="14" class="panel"/>
  <text x="48" y="692" class="head">Lazy Drain Planner · 消费 Session 聚合策略</text>
  <text x="1388" y="692" text-anchor="end" class="small">廉价策略先执行，完整 Scheduler 模拟只对按分数排序后的候选惰性执行</text>
  <g>
    <rect x="46" y="714" width="180" height="92" rx="9" class="step"/><circle cx="65" cy="732" r="11" class="stepNo"/><text x="65" y="733" text-anchor="middle" class="stepNoText">1</text>
    <text x="82" y="732" class="subhead">建立规划状态</text><text x="60" y="758" class="small">Nodes + FreeableUnits</text><text x="60" y="778" class="small">接收池预过滤与容量索引</text>
    <rect x="238" y="714" width="180" height="92" rx="9" class="step"/><circle cx="257" cy="732" r="11" class="stepNo"/><text x="257" y="733" text-anchor="middle" class="stepNoText">2</text>
    <text x="274" y="732" class="subhead">筛选 Victims</text><text x="252" y="758" class="small code">MovableFn AND</text><text x="252" y="778" class="small">Scope / PDB / 所有权硬边界</text>
    <rect x="430" y="714" width="180" height="92" rx="9" class="step"/><circle cx="449" cy="732" r="11" class="stepNo"/><text x="449" y="733" text-anchor="middle" class="stepNoText">3</text>
    <text x="466" y="732" class="subhead">候选预检</text><text x="444" y="758" class="small code">CandidateFilterFn</text><text x="444" y="778" class="small">预算、容量、单调性剪枝</text>
    <rect x="622" y="714" width="180" height="92" rx="9" class="step"/><circle cx="641" cy="732" r="11" class="stepNo"/><text x="641" y="733" text-anchor="middle" class="stepNoText">4</text>
    <text x="658" y="732" class="subhead">候选评分</text><text x="636" y="758" class="small code">DisruptionScoreFn</text><text x="636" y="778" class="small">分批归一化、加权、稳定排序</text>
    <rect x="814" y="714" width="180" height="92" rx="9" class="step"/><circle cx="833" cy="732" r="11" class="stepNo"/><text x="833" y="733" text-anchor="middle" class="stepNoText">5</text>
    <text x="850" y="732" class="subhead">Receiver 排序</text><text x="828" y="758" class="small">Pool ∩ · Victim order</text><text x="828" y="778" class="small">Stability → Disruption → Packing</text>
    <rect x="1006" y="714" width="180" height="92" rx="9" class="step"/><circle cx="1025" cy="732" r="11" class="stepNo"/><text x="1025" y="733" text-anchor="middle" class="stepNoText">6</text>
    <text x="1042" y="732" class="subhead">完整调度模拟</text><text x="1020" y="758" class="small code">FeasibleRelocation</text><text x="1020" y="778" class="small">首个可行候选即提交</text>
    <rect x="1198" y="714" width="194" height="92" rx="9" class="step"/><circle cx="1217" cy="732" r="11" class="stepNo"/><text x="1217" y="733" text-anchor="middle" class="stepNoText">7</text>
    <text x="1234" y="732" class="subhead">收敛与收益门控</text><text x="1212" y="758" class="small">增量状态 → 下一 Step</text><text x="1212" y="778" class="small code">PlanConstraint → Plan / Report</text>
  </g>
  <path d="M226 760H236" class="greenLine"/><path d="M418 760H428" class="greenLine"/><path d="M610 760H620" class="greenLine"/><path d="M802 760H812" class="greenLine"/><path d="M994 760H1004" class="greenLine"/><path d="M1186 760H1196" class="greenLine"/>

  <!-- Boundary footer -->
  <rect x="28" y="858" width="1384" height="46" rx="9" class="boundary"/>
  <text x="720" y="875" text-anchor="middle" class="small"><tspan class="blueText" font-weight="700">Cache</tspan><tspan> 持续追踪集群　→　</tspan><tspan class="blueText" font-weight="700">Scheduler Session</tspan><tspan> 冻结真实调度视图　→　</tspan><tspan class="greenText" font-weight="700">SessionSnapshot</tspan><tspan> 隔离实现　→　</tspan><tspan class="greenText" font-weight="700">Repack Session</tspan><tspan> 组合策略　→　</tspan><tspan class="orangeText" font-weight="700">Planner</tspan><tspan> 搜索计划</tspan></text>
  <text x="720" y="893" text-anchor="middle" class="micro">扩展原则：稳定 Action 与 Planner；新场景优先新增 Plugin 回调。Scheduler Predicate 仍是每个迁移计划不可绕过的最终可行性边界。</text>
</svg>
