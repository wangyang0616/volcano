<svg viewBox="0 0 1120 500" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" role="img">
  <title>每轮归一化评分不是全局效用函数</title>
  <desc>当前算法每轮在不同候选范围内重新归一化并选择最低分路径 A、D；全局方法使用固定目标比较完整路径，选择总原始成本更低的 B、E。</desc>
  <defs><marker id="a5" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#57606a"/></marker></defs>
  <style>.t{fill:#1f2328}.s{fill:#57606a}.box{fill:#fff;stroke:#d0d7de}.cur{fill:#fff4e6;stroke:#e8890c}.opt{fill:#edf9f1;stroke:#2f9e44}.arr{fill:none;stroke:#57606a;stroke-width:1.8;marker-end:url(#a5)}text{dominant-baseline:middle}</style>
  <rect width="1120" height="500" fill="#fff"/><text x="32" y="30" class="t" font-size="18" font-weight="700">场景 5 · 每轮相对最低分，不等于完整路径总成本最低</text>
  <rect x="32" y="54" width="1056" height="72" rx="10" fill="#f6f8fa" stroke="#d0d7de"/><text x="52" y="76" class="t" font-size="12" font-weight="700">每轮按当前候选的最小值和最大值重新缩放为 0～1</text><text x="52" y="102" class="s" font-size="11">候选集合变化后，同一个原始差值的权重会变化；不同轮次的归一化分数不可直接累加。</text>
  <rect x="32" y="146" width="514" height="270" rx="12" class="cur"/><text x="52" y="170" class="t" font-size="14" font-weight="700">当前算法 · 分轮比较</text>
  <rect x="60" y="204" width="130" height="76" rx="8" class="box"/><text x="125" y="222" text-anchor="middle" class="t" font-size="10.5" font-weight="700">第 1 轮</text><text x="125" y="243" text-anchor="middle" class="s" font-size="9.5">范围 1～100</text><text x="125" y="263" text-anchor="middle" fill="#e8890c" font-size="9.5">选择 A · 局部最低</text>
  <path d="M190 242 H252" class="arr"/><rect x="260" y="204" width="130" height="76" rx="8" class="box"/><text x="325" y="222" text-anchor="middle" class="t" font-size="10.5" font-weight="700">第 2 轮</text><text x="325" y="243" text-anchor="middle" class="s" font-size="9.5">范围 40～41</text><text x="325" y="263" text-anchor="middle" fill="#e8890c" font-size="9.5">选择 D · 局部最低</text>
  <path d="M390 242 H428" class="arr"/><rect x="436" y="204" width="84" height="76" rx="8" fill="#e8890c"/><text x="478" y="226" text-anchor="middle" fill="#fff" font-size="10" font-weight="700">A → D</text><text x="478" y="251" text-anchor="middle" fill="#fff" font-size="9">原始总成本 81</text>
  <text x="290" y="330" text-anchor="middle" class="s" font-size="10.5">“每轮都最低”无法推出“整条路径最低”</text>
  <rect x="574" y="146" width="514" height="270" rx="12" class="opt"/><text x="594" y="170" class="t" font-size="14" font-weight="700">全局最优 · 固定目标比较完整路径</text>
  <rect x="612" y="204" width="122" height="76" rx="8" class="box"/><text x="673" y="222" text-anchor="middle" class="t" font-size="10.5" font-weight="700">路径 A → D</text><text x="673" y="244" text-anchor="middle" class="s" font-size="9.5">完整成本 81</text><text x="673" y="264" text-anchor="middle" fill="#e03131" font-size="9.5">后续代价高</text>
  <rect x="780" y="204" width="122" height="76" rx="8" class="box"/><text x="841" y="222" text-anchor="middle" class="t" font-size="10.5" font-weight="700">路径 B → E</text><text x="841" y="244" text-anchor="middle" class="s" font-size="9.5">完整成本 12</text><text x="841" y="264" text-anchor="middle" fill="#2f9e44" font-size="9.5">全局更低</text>
  <path d="M902 242 H964" class="arr"/><rect x="972" y="204" width="88" height="76" rx="8" fill="#2f9e44"/><text x="1016" y="226" text-anchor="middle" fill="#fff" font-size="10" font-weight="700">选择 B → E</text><text x="1016" y="251" text-anchor="middle" fill="#fff" font-size="9">比较全程</text>
  <text x="836" y="330" text-anchor="middle" class="t" font-size="11.5" font-weight="700">固定量纲 + 完整序列成本</text>
  <rect x="32" y="438" width="1056" height="38" rx="8" fill="#f6f8fa" stroke="#d0d7de"/><text x="560" y="457" text-anchor="middle" class="t" font-size="11"><tspan font-weight="700">为什么：</tspan>归一化服务于当前候选排序，不是跨步骤稳定、可累加的全局目标函数。</text>
</svg>
