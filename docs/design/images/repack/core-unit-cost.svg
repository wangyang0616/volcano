<svg viewBox="0 0 940 620" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, sans-serif" role="img">
  <title>图3 每步"选哪个单元"的字典序增量代价</title>
  <desc>每提交一次就重算一次：对每个候选单元算三元组（①增量破组受损卡[已破组记0] ②搬走卡 ③搬走pod），逐位比较取最小者。示例 n1(0,2,1) &lt; n3(0,4,2) &lt; n2(16,4,1)，选 n1。</desc>
  <style>
    .t{fill:#111827;} .s{fill:#5b6472;}
    .m{font-family:ui-monospace,Menlo,monospace;}
    .card{fill:#ffffff;stroke:#c4cbd4;}
    .head{fill:#eef4ff;stroke:#1c7ed6;}
    .win{fill:#e9f7ef;stroke:#2f9e44;}
    .lose{fill:#f7f8fa;stroke:#c4cbd4;}
    text{dominant-baseline:middle;}
  </style>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto"><path d="M0,0 L6.5,3 L0,6 Z" fill="#5b6472"/></marker></defs>

  <text x="470" y="22" text-anchor="middle" font-size="15.5" font-weight="700" class="t">图3 · 选哪个单元 = 字典序增量代价（每提交后动态重算）</text>

  <!-- 定义 -->
  <rect x="24" y="42" width="892" height="78" rx="9" class="head"/>
  <text x="40" y="62" font-size="12" font-weight="700" class="t">每个候选单元算一个三元组，逐位（字典序）比较，取最小者：</text>
  <rect x="40" y="76" width="270" height="34" rx="6" class="card"/><text x="175" y="93" text-anchor="middle" font-size="10" class="t m">① 增量破组受损卡</text><text x="175" y="105" text-anchor="middle" font-size="8" class="s">已破组的 gang → 记 0</text>
  <rect x="326" y="76" width="255" height="34" rx="6" class="card"/><text x="453" y="93" text-anchor="middle" font-size="10" class="t m">② 搬走的卡数</text><text x="453" y="105" text-anchor="middle" font-size="8" class="s">movedGPU（越少越好）</text>
  <rect x="597" y="76" width="301" height="34" rx="6" class="card"/><text x="747" y="93" text-anchor="middle" font-size="10" class="t m">③ 搬走的 pod 数</text><text x="747" y="105" text-anchor="middle" font-size="8" class="s">movedPods（最后打平项）</text>

  <!-- 候选表 -->
  <text x="40" y="142" font-size="12" font-weight="700" class="t">本步的三个候选单元（每单元 = 一个节点上的可动任务集）：</text>

  <!-- 表头 -->
  <rect x="40" y="156" width="120" height="30" class="head"/><text x="100" y="172" text-anchor="middle" font-size="10" font-weight="700" class="t">候选单元</text>
  <rect x="160" y="156" width="200" height="30" class="head"/><text x="260" y="172" text-anchor="middle" font-size="10" font-weight="700" class="t">① 增量破组受损卡</text>
  <rect x="360" y="156" width="140" height="30" class="head"/><text x="430" y="172" text-anchor="middle" font-size="10" font-weight="700" class="t">② 搬走卡</text>
  <rect x="500" y="156" width="140" height="30" class="head"/><text x="570" y="172" text-anchor="middle" font-size="10" font-weight="700" class="t">③ 搬走 pod</text>
  <rect x="640" y="156" width="140" height="30" class="head"/><text x="710" y="172" text-anchor="middle" font-size="10" font-weight="700" class="t">三元组</text>
  <rect x="780" y="156" width="118" height="30" class="head"/><text x="839" y="172" text-anchor="middle" font-size="10" font-weight="700" class="t">判定</text>

  <!-- n1 winner -->
  <rect x="40" y="186" width="120" height="52" class="win"/><text x="100" y="205" text-anchor="middle" font-size="10.5" font-weight="700" class="t m">n1</text><text x="100" y="222" text-anchor="middle" font-size="7.6" class="s">2 卡 1 pod·无 gang</text>
  <rect x="160" y="186" width="200" height="52" class="win"/><text x="260" y="205" text-anchor="middle" font-size="12" font-weight="700" fill="#2f9e44" class="m">0</text><text x="260" y="222" text-anchor="middle" font-size="7.6" class="s">不涉及任何未破 gang</text>
  <rect x="360" y="186" width="140" height="52" class="win"/><text x="430" y="212" text-anchor="middle" font-size="12" class="t m">2</text>
  <rect x="500" y="186" width="140" height="52" class="win"/><text x="570" y="212" text-anchor="middle" font-size="12" class="t m">1</text>
  <rect x="640" y="186" width="140" height="52" class="win"/><text x="710" y="212" text-anchor="middle" font-size="12" font-weight="700" fill="#2f9e44" class="m">(0, 2, 1)</text>
  <rect x="780" y="186" width="118" height="52" class="win"/><text x="839" y="212" text-anchor="middle" font-size="11" font-weight="700" fill="#2f9e44">✓ 最小·选中</text>

  <!-- n3 -->
  <rect x="40" y="238" width="120" height="52" class="lose"/><text x="100" y="257" text-anchor="middle" font-size="10.5" font-weight="700" class="t m">n3</text><text x="100" y="274" text-anchor="middle" font-size="7.6" class="s">gang 已破·搭便车</text>
  <rect x="160" y="238" width="200" height="52" class="lose"/><text x="260" y="257" text-anchor="middle" font-size="12" font-weight="700" fill="#2f9e44" class="m">0</text><text x="260" y="274" text-anchor="middle" font-size="7.6" class="s">gang 已破 → 增量记 0</text>
  <rect x="360" y="238" width="140" height="52" class="lose"/><text x="430" y="264" text-anchor="middle" font-size="12" class="t m">4</text>
  <rect x="500" y="238" width="140" height="52" class="lose"/><text x="570" y="264" text-anchor="middle" font-size="12" class="t m">2</text>
  <rect x="640" y="238" width="140" height="52" class="lose"/><text x="710" y="264" text-anchor="middle" font-size="12" font-weight="700" class="t m">(0, 4, 2)</text>
  <rect x="780" y="238" width="118" height="52" class="lose"/><text x="839" y="258" text-anchor="middle" font-size="8.6" class="s">①打平→比②</text><text x="839" y="273" text-anchor="middle" font-size="8.6" class="s">2&lt;4 输给 n1</text>

  <!-- n2 -->
  <rect x="40" y="290" width="120" height="52" class="lose"/><text x="100" y="309" text-anchor="middle" font-size="10.5" font-weight="700" class="t m">n2</text><text x="100" y="326" text-anchor="middle" font-size="7.6" class="s">破一个未破 gang</text>
  <rect x="160" y="290" width="200" height="52" class="lose"/><text x="260" y="309" text-anchor="middle" font-size="12" font-weight="700" fill="#e03131" class="m">16</text><text x="260" y="326" text-anchor="middle" font-size="7.6" class="s">破组 → 整组 footprint</text>
  <rect x="360" y="290" width="140" height="52" class="lose"/><text x="430" y="316" text-anchor="middle" font-size="12" class="t m">4</text>
  <rect x="500" y="290" width="140" height="52" class="lose"/><text x="570" y="316" text-anchor="middle" font-size="12" class="t m">1</text>
  <rect x="640" y="290" width="140" height="52" class="lose"/><text x="710" y="316" text-anchor="middle" font-size="12" font-weight="700" class="t m">(16, 4, 1)</text>
  <rect x="780" y="290" width="118" height="52" class="lose"/><text x="839" y="310" text-anchor="middle" font-size="8.6" class="s">①最大</text><text x="839" y="325" text-anchor="middle" font-size="8.6" class="s">16 直接出局</text>

  <!-- 比较说明 -->
  <rect x="24" y="360" width="892" height="86" rx="9" class="card"/>
  <text x="40" y="380" font-size="12" font-weight="700" class="t">逐位比较（像比字符串）：</text>
  <text x="40" y="401" font-size="10.5" class="s">先比 ①：n1=n3=0 &lt; n2=16 → n2 出局；n1 与 n3 在 ① 打平。</text>
  <text x="40" y="420" font-size="10.5" class="s">① 平 → 比 ②：n1=2 &lt; n3=4 → <tspan class="t" font-weight="700">n1 胜</tspan>，无需再看 ③。</text>
  <text x="40" y="438" font-size="9.3" class="s">直觉：先绝不无谓破组（①），再少搬卡（②），最后少动 pod（③）——高位一分胜负就不看低位。</text>

  <!-- 动态重算 -->
  <rect x="24" y="458" width="892" height="70" rx="9" class="head"/>
  <text x="40" y="478" font-size="12" font-weight="700" class="t">关键：动态重算，不是一次性静态排序</text>
  <rect x="40" y="490" width="250" height="30" rx="6" class="card"/><text x="165" y="506" text-anchor="middle" font-size="9.3" class="t">选 n1 → 提交、腾空</text>
  <path d="M292,505 L322,505" class="aw" stroke="#5b6472" fill="none" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="324" y="490" width="300" height="30" rx="6" class="card"/><text x="474" y="506" text-anchor="middle" font-size="9.3" class="t">若腾 n1 顺带把某 gang 破了 → 该组进"已破组集合"</text>
  <path d="M626,505 L656,505" class="aw" stroke="#5b6472" fill="none" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="658" y="490" width="240" height="30" rx="6" class="win"/><text x="778" y="506" text-anchor="middle" font-size="9.3" class="t">下一步这些组的 ① 变 0 → 重排</text>

  <text x="470" y="556" text-anchor="middle" font-size="10.5" class="s">这就是"搭便车"的来源：一旦某 gang 被破，它在别的节点上的 pod 下一轮 ①=0，增量骤降，容易被顺带腾走。</text>
  <text x="470" y="580" text-anchor="middle" font-size="9.3" class="s">对照旧方案：不再"多起始排序 + pickBest + LeastDisruptive 加权归一"；单 core 单趟，字典序即最终顺序。</text>
  <text x="470" y="602" text-anchor="middle" font-size="9" class="s">DisruptionScore 插件仍在——它们提供 ①②③ 各维度的原始值，字典序只是"如何把这些维度拼成可比的键"。</text>
</svg>
