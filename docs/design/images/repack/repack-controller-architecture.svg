<svg viewBox="0 0 1280 820" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" role="img">
  <title>Repack Controller 当前架构与 Placement 协议</title>
  <desc>Repack Controller 由生命周期控制器与 Placement Nominator 组成。生命周期控制器只负责终态 RepackRun 的 TTL 回收和 Execute cooldown 保留；Placement Nominator 通过 Pod 与 RepackRun informer、索引和单 worker 队列，完成替换 Pod 的识别、认领、软提名、SchedulingGate 释放、实际落点观测与异常恢复。Repack Engine 负责计划、驱逐、PodGroup lease 和实时接收节点选择；Admission Webhook 注入 gate；Scheduler 完成最终绑定。</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#e2e8f0" stroke-width="1" opacity=".42"/></pattern>
    <marker id="blueArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#2563eb"/></marker>
    <marker id="greenArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/></marker>
    <marker id="orangeArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#f97316"/></marker>
    <style>
      .title{fill:#0f172a;font-size:21px;font-weight:750}.subtitle{fill:#64748b;font-size:11px}.head{fill:#0f172a;font-size:14px;font-weight:700}.subhead{fill:#1e293b;font-size:12px;font-weight:700}.body{fill:#475569;font-size:10.5px}.small{fill:#64748b;font-size:9.5px}.micro{fill:#64748b;font-size:8.5px}.code{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,monospace}.panel{fill:#fff;stroke:#cbd5e1;stroke-width:1.4}.apiPanel{fill:#f8fafc;stroke:#94a3b8;stroke-width:1.5}.controllerPanel{fill:#eff6ff;stroke:#3b82f6;stroke-width:1.8}.peerPanel{fill:#fff7ed;stroke:#fb923c;stroke-width:1.5}.engineCard{fill:#f0fdf4;stroke:#22c55e;stroke-width:1.5}.blueCard{fill:#fff;stroke:#60a5fa;stroke-width:1.35}.greenCard{fill:#fff;stroke:#4ade80;stroke-width:1.35}.orangeCard{fill:#fff;stroke:#fdba74;stroke-width:1.35}.slateCard{fill:#fff;stroke:#cbd5e1;stroke-width:1.2}.badgeBlue{fill:#dbeafe}.badgeGreen{fill:#dcfce7}.badgeOrange{fill:#ffedd5}.blueText{fill:#1d4ed8}.greenText{fill:#15803d}.orangeText{fill:#c2410c}.line{fill:none;stroke:#2563eb;stroke-width:1.65;marker-end:url(#blueArrow)}.greenLine{fill:none;stroke:#16a34a;stroke-width:1.65;marker-end:url(#greenArrow)}.orangeLine{fill:none;stroke:#f97316;stroke-width:1.65;marker-end:url(#orangeArrow)}.dash{stroke-dasharray:6 5}.step{fill:#fff;stroke:#cbd5e1;stroke-width:1.2}.stepNo{fill:#2563eb}.stepNoText{fill:#fff;font-size:9.5px;font-weight:700}.boundary{fill:#f8fafc;stroke:#e2e8f0;stroke-width:1.2}
    </style>
  </defs>
  <rect width="1280" height="820" fill="#fff"/><rect width="1280" height="820" fill="url(#grid)"/>
  <text x="640" y="34" text-anchor="middle" class="title">Repack Controller 当前架构与 Placement 协议</text>
  <text x="640" y="56" text-anchor="middle" class="subtitle">持久状态连接 Engine 与 Controller；软提名连接 Placement 决策与最终调度</text>

  <!-- Kubernetes API state -->
  <rect x="28" y="82" width="258" height="476" rx="14" class="apiPanel"/>
  <text x="157" y="108" text-anchor="middle" class="head">Kubernetes API · 持久事实</text>
  <rect x="48" y="130" width="218" height="118" rx="10" class="slateCard"/>
  <rect x="62" y="143" width="78" height="22" rx="11" class="badgeGreen"/><text x="101" y="154" text-anchor="middle" class="small greenText code">RepackRun</text>
  <text x="62" y="181" class="body code">status.plan</text><text x="62" y="200" class="body code">status.relocations[]</text>
  <text x="62" y="219" class="small">eviction journal · placement · result</text><text x="62" y="236" class="micro">Engine 与 Controller 的恢复边界</text>
  <rect x="48" y="264" width="218" height="92" rx="10" class="slateCard"/>
  <rect x="62" y="277" width="76" height="22" rx="11" class="badgeOrange"/><text x="100" y="288" text-anchor="middle" class="small orangeText code">PodGroup</text>
  <text x="62" y="317" class="body code">placement-lease = Run name / UID</text><text x="62" y="337" class="small">重建代际映射 · workload lineage</text>
  <rect x="48" y="372" width="218" height="126" rx="10" class="slateCard"/>
  <rect x="62" y="385" width="114" height="22" rx="11" class="badgeBlue"/><text x="119" y="396" text-anchor="middle" class="small blueText">Replacement Pod</text>
  <text x="62" y="425" class="body code">schedulingGate + owner</text><text x="62" y="444" class="body code">status.nominatedNodeName</text>
  <text x="62" y="463" class="body code">spec.nodeName</text><text x="62" y="484" class="micro">暂停 → 软提名 → 最终绑定事实</text>
  <rect x="48" y="514" width="218" height="28" rx="7" fill="#e2e8f0"/><text x="157" y="528" text-anchor="middle" class="small">Pod / RepackRun Informer + Index</text>

  <!-- Controller manager -->
  <rect x="318" y="82" width="580" height="476" rx="14" class="controllerPanel"/>
  <rect x="318" y="82" width="580" height="48" rx="14" fill="#2563eb"/><path d="M318 116H898V130H318Z" fill="#2563eb"/>
  <text x="608" y="102" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">Volcano Controller Manager · Repack Controller</text>
  <text x="608" y="119" text-anchor="middle" font-size="9" fill="#dbeafe">framework shim；默认关闭，可显式启用 · 也可使用独立 repack-controller 进程</text>
  <rect x="338" y="148" width="540" height="54" rx="9" class="blueCard"/>
  <text x="608" y="167" text-anchor="middle" class="subhead">事件入口与定位索引</text>
  <text x="608" y="187" text-anchor="middle" class="small code">Pod / RepackRun informer → PodGroup · gate owner · victim indexes → rate-limiting queue</text>

  <rect x="338" y="220" width="244" height="190" rx="10" class="blueCard"/>
  <rect x="352" y="234" width="108" height="23" rx="11" class="badgeBlue"/><text x="406" y="246" text-anchor="middle" class="small blueText">Lifecycle Controller</text>
  <text x="352" y="280" class="subhead">终态 RepackRun 回收</text>
  <text x="352" y="305" class="body">• 只处理 Succeeded / Failed</text><text x="352" y="327" class="body code">• ttlSecondsAfterFinished</text>
  <text x="352" y="349" class="body">• Execute cooldown 保留底线</text><text x="352" y="371" class="body code">• AddAfter(expiry) / DELETE</text>
  <text x="352" y="394" class="micro">不管理非终态阶段；阶段与条件由 Engine 驱动</text>

  <rect x="602" y="220" width="276" height="276" rx="10" class="greenCard"/>
  <rect x="616" y="234" width="130" height="23" rx="11" class="badgeGreen"/><text x="681" y="246" text-anchor="middle" class="small greenText">Placement Nominator</text>
  <text x="616" y="280" class="subhead">替换 Pod 协调器 · 单 worker</text>
  <text x="616" y="305" class="body">1. 校验 gate owner 与活动 Run</text><text x="616" y="327" class="body">2. 恢复 PodGroup 代际与失效 claim</text>
  <text x="616" y="349" class="body">3. 匹配并认领 relocation</text><text x="630" y="366" class="micro code">replacement UID → victim name</text>
  <text x="630" y="379" class="micro code">requirements hash → homogeneous PodGroup</text>
  <text x="616" y="401" class="body">4. 等待 Engine 写 selectedNodeName</text><text x="616" y="423" class="body code">5. persist claim → nominate → open gate</text>
  <text x="616" y="445" class="body">6. 观察 actualNodeName / alternative</text><text x="616" y="467" class="body">7. 超时、终态、孤儿 gate 幂等释放</text>
  <text x="616" y="487" class="micro">串行写同一 Run status，减少 resourceVersion 冲突</text>

  <rect x="338" y="428" width="244" height="68" rx="9" class="slateCard"/>
  <text x="352" y="448" class="subhead code">pkg/state + pkg/placement</text><text x="352" y="468" class="small">TTL / cooldown · owner identity</text>
  <text x="352" y="485" class="small">active placement · workload / PodGroup 关联</text>
  <rect x="338" y="512" width="540" height="28" rx="7" fill="#dbeafe"/><text x="608" y="526" text-anchor="middle" class="small blueText">Controller 不规划、不选择 receiver、不驱逐、不绑定 Pod</text>

  <!-- Peers -->
  <rect x="930" y="82" width="322" height="476" rx="14" class="peerPanel"/><text x="1091" y="108" text-anchor="middle" class="head">协作组件 · 明确所有权</text>
  <rect x="950" y="130" width="282" height="102" rx="10" class="engineCard"/>
  <text x="1091" y="153" text-anchor="middle" class="subhead greenText">Repack Engine</text><text x="1091" y="176" text-anchor="middle" class="body">计划 / eviction journal / 执行超时</text>
  <text x="1091" y="196" text-anchor="middle" class="body">准备 lease；实时 Scheduler Session 选 receiver</text><text x="1091" y="216" text-anchor="middle" class="small code">writes selectedNodeName</text>
  <rect x="950" y="248" width="282" height="76" rx="10" class="orangeCard"/>
  <text x="1091" y="270" text-anchor="middle" class="subhead orangeText">Admission Webhooks</text><text x="1091" y="291" text-anchor="middle" class="body">PodGroup 继承 lease · Pod 注入 gate + owner</text>
  <text x="1091" y="309" text-anchor="middle" class="small">仅对活动 Run 和匹配 PodGroup 生效</text>
  <rect x="950" y="340" width="282" height="72" rx="10" class="orangeCard"/>
  <text x="1091" y="363" text-anchor="middle" class="subhead orangeText">Workload Controller</text><text x="1091" y="385" text-anchor="middle" class="body">响应删除，重建 Pod / PodGroup</text>
  <text x="1091" y="401" text-anchor="middle" class="micro">VCJob · Deployment · StatefulSet · ModelServing …</text>
  <rect x="950" y="428" width="282" height="68" rx="10" class="blueCard"/>
  <text x="1091" y="451" text-anchor="middle" class="subhead blueText">Volcano Scheduler</text><text x="1091" y="473" text-anchor="middle" class="body">消费软提名并按实时状态完成最终绑定</text>
  <text x="1091" y="489" text-anchor="middle" class="micro">selected node 不可行时可选择替代节点</text>
  <rect x="950" y="512" width="282" height="28" rx="7" fill="#ffedd5"/><text x="1091" y="526" text-anchor="middle" class="small orangeText">最终事实：Pod.spec.nodeName</text>

  <!-- Architectural data paths -->
  <path d="M286 176H316" class="line"/><text x="301" y="164" text-anchor="middle" class="micro blueText">watch</text>
  <path d="M318 460H288" class="line dash"/><text x="302" y="477" text-anchor="middle" class="micro blueText">patch</text>
  <path d="M930 181H900" class="greenLine"/><text x="915" y="169" text-anchor="middle" class="micro greenText">Run status</text>
  <path d="M930 286H900" class="orangeLine dash"/><text x="915" y="273" text-anchor="middle" class="micro orangeText">Pod gate</text>
  <path d="M900 451H928" class="line"/><text x="914" y="439" text-anchor="middle" class="micro blueText">via Pod</text>

  <!-- Placement handshake -->
  <rect x="28" y="586" width="1224" height="166" rx="14" class="panel"/>
  <text x="48" y="610" class="head">Execute Placement 握手</text>
  <text x="1228" y="610" text-anchor="end" class="small">全部步骤均可由持久状态恢复；执行 deadline 覆盖驱逐、重建、选点、绑定与结果验证</text>
  <g>
    <rect x="48" y="632" width="158" height="88" rx="9" class="step"/><circle cx="66" cy="649" r="11" class="stepNo"/><text x="66" y="650" text-anchor="middle" class="stepNoText">1</text>
    <text x="82" y="649" class="subhead">准备执行事实</text><text x="62" y="675" class="small">Engine 持久化 plan / journal</text><text x="62" y="694" class="small">写 PodGroup lease 后才驱逐</text>
    <rect x="220" y="632" width="158" height="88" rx="9" class="step"/><circle cx="238" cy="649" r="11" class="stepNo"/><text x="238" y="650" text-anchor="middle" class="stepNoText">2</text>
    <text x="254" y="649" class="subhead">创建并暂停</text><text x="234" y="675" class="small">工作负载控制器重建</text><text x="234" y="694" class="small">Webhook 注入 gate + owner</text>
    <rect x="392" y="632" width="158" height="88" rx="9" class="step"/><circle cx="410" cy="649" r="11" class="stepNo"/><text x="410" y="650" text-anchor="middle" class="stepNoText">3</text>
    <text x="426" y="649" class="subhead">匹配并认领</text><text x="406" y="675" class="small">Nominator 关联 relocation</text><text x="406" y="694" class="small code">WaitingForNodeSelection</text>
    <rect x="564" y="632" width="158" height="88" rx="9" class="step"/><circle cx="582" cy="649" r="11" class="stepNo"/><text x="582" y="650" text-anchor="middle" class="stepNoText">4</text>
    <text x="598" y="649" class="subhead">在线选择节点</text><text x="578" y="675" class="small">Engine 完整调度模拟</text><text x="578" y="694" class="small code">selectedNodeName</text>
    <rect x="736" y="632" width="158" height="88" rx="9" class="step"/><circle cx="754" cy="649" r="11" class="stepNo"/><text x="754" y="650" text-anchor="middle" class="stepNoText">5</text>
    <text x="770" y="649" class="subhead">提名并放行</text><text x="750" y="675" class="small">Controller 先持久化 claim</text><text x="750" y="694" class="small">写 nomination · 移除 gate</text>
    <rect x="908" y="632" width="158" height="88" rx="9" class="step"/><circle cx="926" cy="649" r="11" class="stepNo"/><text x="926" y="650" text-anchor="middle" class="stepNoText">6</text>
    <text x="942" y="649" class="subhead">最终调度</text><text x="922" y="675" class="small">Scheduler 校验实时状态</text><text x="922" y="694" class="small">绑定建议节点或替代节点</text>
    <rect x="1080" y="632" width="152" height="88" rx="9" class="step"/><circle cx="1098" cy="649" r="11" class="stepNo"/><text x="1098" y="650" text-anchor="middle" class="stepNoText">7</text>
    <text x="1114" y="649" class="subhead">观测与收敛</text><text x="1094" y="675" class="small code">actualNodeName / Placed</text><text x="1094" y="694" class="small">Engine 验证收益并清理 lease</text>
  </g>
  <path d="M206 676H218" class="greenLine"/><path d="M378 676H390" class="greenLine"/><path d="M550 676H562" class="greenLine"/><path d="M722 676H734" class="greenLine"/><path d="M894 676H906" class="greenLine"/><path d="M1066 676H1078" class="greenLine"/>

  <rect x="28" y="770" width="1224" height="32" rx="8" class="boundary"/>
  <text x="640" y="786" text-anchor="middle" class="small"><tspan class="greenText" font-weight="700">Engine</tspan><tspan>：规划、驱逐、lease、实时选点、结果验证　｜　</tspan><tspan class="blueText" font-weight="700">Controller</tspan><tspan>：TTL、替换 Pod 协调、gate、nomination、落点观测　｜　</tspan><tspan class="orangeText" font-weight="700">Scheduler</tspan><tspan>：最终可行性与绑定</tspan></text>
</svg>
