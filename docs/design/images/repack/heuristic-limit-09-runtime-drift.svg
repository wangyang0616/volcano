<svg viewBox="0 0 1120 500" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" role="img">
  <title>在线状态变化使实际结果低于计划</title>
  <desc>快照中 victim P 可以迁移到 R1 并释放 T。执行前新工作负载占用 R1 或 PDB 拒绝驱逐，导致 P 调度到其他节点或保持 Pending，T 未按计划腾空。这是在线执行不确定性，不是规划局部最优。</desc>
  <defs><marker id="a9" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#57606a"/></marker></defs>
  <style>.t{fill:#1f2328}.s{fill:#57606a}.box{fill:#fff;stroke:#d0d7de}.cur{fill:#fff4e6;stroke:#e8890c}.opt{fill:#edf9f1;stroke:#2f9e44}.bad{fill:#fff1f0;stroke:#e03131}.arr{fill:none;stroke:#57606a;stroke-width:1.8;marker-end:url(#a9)}text{dominant-baseline:middle}</style>
  <rect width="1120" height="500" fill="#fff"/><text x="32" y="30" class="t" font-size="18" font-weight="700">场景 9 · 快照中的好计划，不等于实时执行结果被锁定</text>
  <rect x="32" y="54" width="1056" height="72" rx="10" fill="#f6f8fa" stroke="#d0d7de"/><text x="52" y="76" class="t" font-size="12" font-weight="700">规划不锁定节点、不预留资源、不绕过 PDB，nominatedNodeName 也不是强制绑定</text><text x="52" y="102" class="s" font-size="11">Scheduler 和 API Server 始终按 Execute 时的真实状态做最终决定。</text>
  <rect x="32" y="146" width="514" height="270" rx="12" class="opt"/><text x="52" y="170" class="t" font-size="14" font-weight="700">稳定快照下的预期结果</text>
  <rect x="70" y="218" width="102" height="68" rx="8" class="box"/><text x="121" y="238" text-anchor="middle" class="t" font-size="11" font-weight="700">源节点 T</text><text x="121" y="262" text-anchor="middle" class="s" font-size="9.5">victim P</text>
  <path d="M172 252 H260" class="arr"/><text x="216" y="238" text-anchor="middle" class="s" font-size="9">模拟迁移</text><rect x="268" y="218" width="102" height="68" rx="8" class="box"/><text x="319" y="238" text-anchor="middle" class="t" font-size="11" font-weight="700">接收 R1</text><text x="319" y="262" text-anchor="middle" class="s" font-size="9.5">容量可用</text>
  <path d="M370 252 H426" class="arr"/><rect x="434" y="212" width="86" height="80" rx="8" fill="#2f9e44"/><text x="477" y="236" text-anchor="middle" fill="#fff" font-size="10.5" font-weight="700">T 腾空</text><text x="477" y="260" text-anchor="middle" fill="#fff" font-size="9.5">收益实现</text>
  <text x="286" y="338" text-anchor="middle" class="t" font-size="11.5" font-weight="700">这是计划快照，不是资源承诺</text>
  <rect x="574" y="146" width="514" height="270" rx="12" class="cur"/><text x="594" y="170" class="t" font-size="14" font-weight="700">实时 Execute 可能发生</text>
  <rect x="608" y="204" width="126" height="62" rx="8" class="bad"/><text x="671" y="223" text-anchor="middle" fill="#e03131" font-size="10.5" font-weight="700">新 Pod 占用 R1</text><text x="671" y="245" text-anchor="middle" class="s" font-size="9.5">或节点状态变化</text>
  <rect x="608" y="294" width="126" height="62" rx="8" class="bad"/><text x="671" y="313" text-anchor="middle" fill="#e03131" font-size="10.5" font-weight="700">PDB 拒绝驱逐</text><text x="671" y="335" text-anchor="middle" class="s" font-size="9.5">或控制器扩大重建</text>
  <path d="M734 235 H812" class="arr"/><path d="M734 325 H792 V250" class="arr"/><rect x="820" y="210" width="118" height="80" rx="8" class="box"/><text x="879" y="231" text-anchor="middle" class="t" font-size="10.5" font-weight="700">P → R2 / Pending</text><text x="879" y="254" text-anchor="middle" class="s" font-size="9.5">Scheduler 实时决策</text><text x="879" y="273" text-anchor="middle" class="s" font-size="9.5">或驱逐未发生</text>
  <path d="M938 250 H970" class="arr"/><rect x="978" y="210" width="82" height="80" rx="8" fill="#e03131"/><text x="1019" y="233" text-anchor="middle" fill="#fff" font-size="10" font-weight="700">T 未腾空</text><text x="1019" y="257" text-anchor="middle" fill="#fff" font-size="9">实际收益下降</text>
  <text x="834" y="338" text-anchor="middle" class="s" font-size="10.5">应以 status.result 和终态验证为准</text>
  <rect x="32" y="438" width="1056" height="38" rx="8" fill="#f6f8fa" stroke="#d0d7de"/><text x="560" y="457" text-anchor="middle" class="t" font-size="11"><tspan font-weight="700">为什么：</tspan>这是在线执行漂移，不是规划算法局部最优；不预留资源是为了保持 Scheduler 权威并避免容量锁死。</text>
</svg>
