<svg viewBox="0 0 1120 430" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'PingFang SC','Microsoft YaHei',sans-serif" role="img">
  <title>接收节点填充排序：优先填入必然保持占用的节点</title>
  <desc>node-a 上的两张 GPU 需要迁移。node-d 的目标资源全部空闲，不作为接收节点；node-b 因不可迁移 Pod 或范围限制会保持占用，而且只有两张空闲 GPU，因此优先于仍可能腾空的 node-c。迁移后 node-a 的 GPU 全部空闲，node-b 的 GPU 全部占用，node-c 和 node-d 保持不变。</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#1c7ed6"/></marker></defs>
  <rect width="1120" height="430" fill="#fff"/>
  <text x="32" y="32" font-size="17" font-weight="700" fill="#1f2328">接收节点排序：优先填充确定保持占用的节点</text>
  <text x="32" y="56" font-size="11" fill="#57606a">排序只决定可行接收节点的尝试顺序；最终每个 Pod 仍必须通过 Scheduler 的完整实时约束。</text>

  <rect x="36" y="90" width="210" height="242" rx="12" fill="#fff8e8" stroke="#e8890c"/>
  <text x="56" y="119" font-size="13" font-weight="700" fill="#1f2328">待迁移 Pod</text>
  <text x="56" y="140" font-size="10" fill="#57606a">从腾空目标 node-a 迁出 2 GPU</text>
  <rect x="58" y="166" width="166" height="92" rx="9" fill="#fff" stroke="#e8890c"/>
  <text x="141" y="190" text-anchor="middle" font-size="11" font-weight="700" fill="#1f2328">node-a · 2/8</text>
  <g transform="translate(73,207)"><rect width="12" height="16" rx="3" fill="#e8890c"/><rect x="18" width="12" height="16" rx="3" fill="#e8890c"/><g fill="#fff" stroke="#9aa4b2" stroke-dasharray="3 2"><rect x="36" width="12" height="16" rx="3"/><rect x="54" width="12" height="16" rx="3"/><rect x="72" width="12" height="16" rx="3"/><rect x="90" width="12" height="16" rx="3"/><rect x="108" width="12" height="16" rx="3"/><rect x="126" width="12" height="16" rx="3"/></g></g>
  <text x="141" y="246" text-anchor="middle" font-size="9.5" font-weight="700" fill="#e8890c">正在腾空，不能接回</text>
  <text x="56" y="290" font-size="10" fill="#57606a">目标：迁走橙色 Pod 后，</text>
  <text x="56" y="308" font-size="10" fill="#57606a">node-a 的 8 张卡全部空闲。</text>

  <path d="M258,210 L304,210" fill="none" stroke="#1c7ed6" stroke-width="2" marker-end="url(#a)"/>
  <rect x="318" y="90" width="482" height="242" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="338" y="119" font-size="13" font-weight="700" fill="#1f2328">候选接收节点 · 先排除，再分层排序</text>
  <rect x="340" y="142" width="438" height="50" rx="8" fill="#edf9f1" stroke="#2f9e44"/>
  <text x="358" y="163" font-size="10.5" font-weight="700" fill="#2f9e44">① node-b · 6/8 · 本来就会保持占用</text>
  <text x="358" y="180" font-size="9.5" fill="#57606a">不可迁移 Pod、Scope 外工作负载、已接收迁移或已证明无法腾空 → 优先填充</text>
  <rect x="340" y="202" width="438" height="50" rx="8" fill="#eaf4ff" stroke="#1c7ed6"/>
  <text x="358" y="223" font-size="10.5" font-weight="700" fill="#1c7ed6">② node-c · 4/8 · 仍可能成为后续腾空目标</text>
  <text x="358" y="240" font-size="9.5" fill="#57606a">比较未来腾空的 MinAvailable 风险、工作负载影响和迁移量；成本更高者先使用</text>
  <rect x="340" y="262" width="438" height="50" rx="8" fill="#fff1f0" stroke="#e03131" stroke-dasharray="5 3"/>
  <text x="358" y="283" font-size="10.5" font-weight="700" fill="#e03131">× node-d · 0/8 · 目标加速卡完全空闲</text>
  <text x="358" y="300" font-size="9.5" fill="#57606a">迁入会重新占用一个目标资源全部空闲的节点，因此不作为接收节点</text>
  <text x="559" y="325" text-anchor="middle" font-size="9.5" fill="#57606a">同一层级、同一未来成本时，使用 best-fit：迁入后目标资源余量更少者优先。</text>

  <path d="M812,210 L858,210" fill="none" stroke="#1c7ed6" stroke-width="2" marker-end="url(#a)"/>
  <rect x="872" y="90" width="212" height="242" rx="12" fill="#edf9f1" stroke="#2f9e44"/>
  <text x="892" y="119" font-size="13" font-weight="700" fill="#1f2328">本例结果</text>
  <rect x="894" y="144" width="168" height="60" rx="8" fill="#fff" stroke="#2f9e44"/>
  <text x="978" y="167" text-anchor="middle" font-size="10.5" font-weight="700" fill="#2f9e44">node-a · 0/8</text>
  <text x="978" y="186" text-anchor="middle" font-size="9.5" fill="#57606a">GPU 全部空闲</text>
  <rect x="894" y="216" width="168" height="60" rx="8" fill="#fff" stroke="#2f9e44"/>
  <text x="978" y="239" text-anchor="middle" font-size="10.5" font-weight="700" fill="#2f9e44">node-b · 8/8</text>
  <text x="978" y="258" text-anchor="middle" font-size="9.5" fill="#57606a">接收 2 GPU 后全部占用</text>
  <text x="978" y="304" text-anchor="middle" font-size="9.5" fill="#57606a">node-c、node-d 保持不变</text>

  <rect x="110" y="366" width="900" height="38" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="560" y="390" text-anchor="middle" font-size="10.5" fill="#1f2328">结果：腾空 node-a 且不占用 node-d，同时为后续整理保留更多完整节点容量。</text>
</svg>
