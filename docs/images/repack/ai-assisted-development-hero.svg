<svg viewBox="0 0 1440 810" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">利用 AI 进行复杂特性开发</title>
  <desc id="desc">采用云原生技术分享风格，展示 AI 辅助下从需求到 Volcano Repack 工程系统的构建过程。</desc>
  <defs>
    <linearGradient id="hero-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071827"/>
      <stop offset=".58" stop-color="#0A2440"/>
      <stop offset="1" stop-color="#10365A"/>
    </linearGradient>
    <linearGradient id="blue-panel" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#1E6FD9" stop-opacity=".28"/>
      <stop offset="1" stop-color="#19A7CE" stop-opacity=".08"/>
    </linearGradient>
    <linearGradient id="orange-panel" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#F4511E" stop-opacity=".92"/>
      <stop offset="1" stop-color="#FF7A32" stop-opacity=".72"/>
    </linearGradient>
    <pattern id="blueprint" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#84B9DD" stroke-width="1" opacity=".09"/>
      <circle cx="0" cy="0" r="1.5" fill="#A8D8F4" opacity=".18"/>
    </pattern>
    <filter id="panel-shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#020912" flood-opacity=".38"/>
    </filter>
    <filter id="blue-glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1440" height="810" fill="url(#hero-bg)"/>
  <rect width="1440" height="810" fill="url(#blueprint)"/>
  <path d="M0 650C280 584 521 614 715 682c216 75 449 84 725 1v127H0Z" fill="#06131F" opacity=".72"/>

  <!-- Volcano pixel mark -->
  <g transform="translate(1240 64) rotate(45)" fill="#F4511E">
    <rect x="0" y="0" width="22" height="22" rx="2"/>
    <rect x="30" y="0" width="22" height="22" rx="2"/>
    <rect x="60" y="0" width="22" height="22" rx="2"/>
    <rect x="15" y="30" width="22" height="22" rx="2" opacity=".92"/>
    <rect x="45" y="30" width="22" height="22" rx="2" opacity=".92"/>
    <rect x="30" y="60" width="22" height="22" rx="2" opacity=".82"/>
  </g>

  <g font-family="Inter,'PingFang SC','Microsoft YaHei',sans-serif">
    <text x="82" y="96" fill="#72C7FF" font-size="14" font-weight="600" letter-spacing="3">AI-ASSISTED ENGINEERING · VOLCANO</text>
    <text x="80" y="176" fill="#FFFFFF" font-size="62" font-weight="700">利用 AI 进行复杂特性开发</text>
    <text x="83" y="229" fill="#C0D3E3" font-size="28" font-weight="500">Volcano Repack 开发实践</text>
    <text x="83" y="277" fill="#7FA0B9" font-size="17">从一个能力构想，到可设计、验证、交付和持续演进的云原生工程系统</text>
  </g>

  <!-- AI engineering sidecar -->
  <g transform="translate(82 356)" filter="url(#panel-shadow)" font-family="Inter,'PingFang SC','Microsoft YaHei',sans-serif">
    <rect width="318" height="286" rx="10" fill="#0B1F34" stroke="#297FC0" stroke-width="1.5"/>
    <rect width="318" height="40" rx="10" fill="#102B47"/>
    <path d="M0 40H318" stroke="#24577D"/>
    <circle cx="22" cy="20" r="5" fill="#F4511E"/>
    <circle cx="40" cy="20" r="5" fill="#FFB020"/>
    <circle cx="58" cy="20" r="5" fill="#23B47E"/>
    <text x="82" y="25" fill="#8EADC4" font-size="11" letter-spacing="1">AI ENGINEERING CONTEXT</text>

    <text x="24" y="77" fill="#4DA3E3" font-size="12">01</text>
    <text x="58" y="77" fill="#D7E8F5" font-size="13">Understand repository context</text>
    <text x="24" y="113" fill="#4DA3E3" font-size="12">02</text>
    <text x="58" y="113" fill="#D7E8F5" font-size="13">Explore architecture choices</text>
    <text x="24" y="149" fill="#4DA3E3" font-size="12">03</text>
    <text x="58" y="149" fill="#D7E8F5" font-size="13">Implement across boundaries</text>
    <text x="24" y="185" fill="#4DA3E3" font-size="12">04</text>
    <text x="58" y="185" fill="#D7E8F5" font-size="13">Test against real scenarios</text>
    <text x="24" y="221" fill="#4DA3E3" font-size="12">05</text>
    <text x="58" y="221" fill="#D7E8F5" font-size="13">Review and converge</text>
    <rect x="22" y="248" width="274" height="20" rx="4" fill="#13385A"/>
    <rect x="22" y="248" width="226" height="20" rx="4" fill="#1D76C4" opacity=".72"/>
    <text x="30" y="262" fill="#C5E8FF" font-size="9" letter-spacing="1">CONTEXT PRESERVED ACROSS ITERATIONS</text>
  </g>

  <!-- System architecture board -->
  <g transform="translate(458 330)" filter="url(#panel-shadow)" font-family="Inter,'PingFang SC','Microsoft YaHei',sans-serif">
    <rect width="896" height="360" rx="12" fill="#F8FBFD"/>
    <rect width="896" height="52" rx="12" fill="#EFF4F8"/>
    <path d="M0 52H896" stroke="#CFDCE6"/>
    <text x="24" y="32" fill="#1B3448" font-size="13" font-weight="700" letter-spacing="1.4">TARGET ENGINEERING SYSTEM</text>
    <rect x="701" y="14" width="170" height="25" rx="4" fill="#E5F4FF"/>
    <circle cx="719" cy="26.5" r="5" fill="#326CE5"/>
    <text x="733" y="30.5" fill="#245B9A" font-size="10" font-weight="600">SCHEDULER-AWARE</text>

    <!-- API layer -->
    <g transform="translate(24 78)">
      <rect width="848" height="58" rx="7" fill="#FFF5EE" stroke="#F7B08D"/>
      <g transform="translate(18 12) rotate(45)" fill="#F4511E"><rect width="12" height="12"/><rect x="17" width="12" height="12"/><rect x="8.5" y="17" width="12" height="12"/></g>
      <text x="67" y="27" fill="#71331F" font-size="13" font-weight="700">RepackRun API</text>
      <text x="67" y="45" fill="#9A634F" font-size="11">SPEC · PLAN · RELOCATIONS · RESULT</text>
      <rect x="646" y="16" width="82" height="27" rx="4" fill="#FFFFFF" stroke="#F4C2A8"/>
      <text x="687" y="34" fill="#8A4C36" font-size="10" text-anchor="middle">DryRun</text>
      <rect x="740" y="16" width="82" height="27" rx="4" fill="#F4511E"/>
      <text x="781" y="34" fill="#FFFFFF" font-size="10" font-weight="600" text-anchor="middle">Execute</text>
    </g>

    <!-- components -->
    <g transform="translate(24 154)">
      <rect width="258" height="112" rx="7" fill="url(#blue-panel)" stroke="#5B9BD5"/>
      <rect x="16" y="16" width="38" height="38" rx="7" fill="#326CE5"/>
      <path d="M26 35h18M35 26v18" stroke="#FFF" stroke-width="3" stroke-linecap="round"/>
      <text x="68" y="34" fill="#183E66" font-size="14" font-weight="700">Repack Engine</text>
      <text x="18" y="76" fill="#486780" font-size="11">ACTION · PLANNER · PLUGINS</text>
      <text x="18" y="96" fill="#486780" font-size="11">EVICTION · RECOVERY · STATUS</text>

      <rect x="295" width="258" height="112" rx="7" fill="#EEF7FF" stroke="#80B7E5"/>
      <rect x="311" y="16" width="38" height="38" rx="7" fill="#1B83C6"/>
      <path d="M321 43v-16h18v16M325 34h10" fill="none" stroke="#FFF" stroke-width="2.5"/>
      <text x="363" y="34" fill="#183E66" font-size="14" font-weight="700">Repack Controller</text>
      <text x="313" y="76" fill="#486780" font-size="11">PLACEMENT · NOMINATION</text>
      <text x="313" y="96" fill="#486780" font-size="11">REPLACEMENT · OBSERVATION</text>

      <rect x="590" width="258" height="112" rx="7" fill="#EDF4FE" stroke="#79A7E9"/>
      <rect x="606" y="16" width="38" height="38" rx="19" fill="#326CE5"/>
      <path d="M625 24v22M614 35h22M617 27l16 16M633 27l-16 16" stroke="#FFF" stroke-width="2"/>
      <text x="658" y="34" fill="#183E66" font-size="14" font-weight="700">Volcano Scheduler</text>
      <text x="608" y="76" fill="#486780" font-size="11">SESSION · CACHE · PREDICATE</text>
      <text x="608" y="96" fill="#486780" font-size="11">FINAL SCHEDULING DECISION</text>
    </g>

    <!-- foundation -->
    <g transform="translate(24 284)">
      <rect width="848" height="52" rx="7" fill="#0D6DCC"/>
      <g transform="translate(18 9)">
        <path d="M17 0l15 8v18l-15 8L2 26V8Z" fill="none" stroke="#FFF" stroke-width="2"/>
        <circle cx="17" cy="17" r="5" fill="none" stroke="#FFF" stroke-width="2"/>
        <path d="M17 5v7M17 22v7M5 17h7M22 17h7" stroke="#FFF" stroke-width="2"/>
      </g>
      <text x="64" y="23" fill="#FFFFFF" font-size="14" font-weight="700">Kubernetes Control Plane &amp; Cluster State</text>
      <text x="64" y="40" fill="#BBDDFF" font-size="10.5">API SERVER · INFORMERS · EVICTION API · NODES · PODS</text>
      <text x="819" y="31" fill="#FFFFFF" font-size="11" font-weight="700" text-anchor="end">SOURCE OF TRUTH</text>
    </g>
  </g>

  <path d="M400 500H448" stroke="#47A7E8" stroke-width="2" stroke-dasharray="5 5"/>
  <circle cx="448" cy="500" r="5" fill="#47A7E8" filter="url(#blue-glow)"/>

  <g font-family="Inter,'PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="82" y="716" width="1272" height="42" rx="5" fill="#0D2A45" stroke="#204F72"/>
    <text x="106" y="742" fill="#8FB3CF" font-size="12" letter-spacing="1.4">HUMAN JUDGMENT</text>
    <text x="286" y="742" fill="#F4511E" font-size="16">×</text>
    <text x="318" y="742" fill="#8FB3CF" font-size="12" letter-spacing="1.4">AI ENGINEERING LEVERAGE</text>
    <text x="548" y="742" fill="#F4511E" font-size="16">×</text>
    <text x="580" y="742" fill="#8FB3CF" font-size="12" letter-spacing="1.4">CODE · TEST · CLUSTER EVIDENCE</text>
    <rect x="1207" y="727" width="123" height="20" rx="3" fill="url(#orange-panel)"/>
    <text x="1268.5" y="741" fill="#FFFFFF" font-size="9.5" font-weight="700" text-anchor="middle">FROM 0 TO 1</text>
  </g>
</svg>
