<svg viewBox="0 0 1120 420" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'PingFang SC','Microsoft YaHei',sans-serif" role="img">
  <title>碎片整理将分散空闲卡转化为完整可用容量</title>
  <desc>整理前四个八卡节点各使用六张卡、空闲两张，集群总计空闲八张卡但无法承接八卡任务。整理后工作负载集中到三个节点，第四个节点八张卡全部空闲，可承接一个八卡训练任务。物理卡总数和空闲卡总数都没有变化。</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#1c7ed6"/></marker></defs>
  <rect width="1120" height="420" fill="#fff"/>
  <text x="32" y="32" font-size="17" font-weight="700" fill="#1f2328">碎片整理的价值：空闲卡总数没变，“能承接的业务”变了</text>
  <text x="32" y="56" font-size="11" fill="#57606a">Repack 不创造新资源；它通过调整资源布局，释放训练和推理任务能够直接使用的完整节点容量。</text>

  <rect x="36" y="90" width="420" height="238" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="56" y="120" font-size="13" font-weight="700" fill="#1f2328">整理前 · 4 个节点各空 2 卡</text>
  <text x="56" y="141" font-size="10" fill="#57606a">总空闲 8 GPU，但没有一台完整空节点</text>
  <g transform="translate(56,164)">
    <g><text x="44" y="0" text-anchor="middle" font-size="9.5" font-weight="700" fill="#1f2328">node-a · 6/8</text><rect x="0" y="12" width="88" height="72" rx="8" fill="#fff" stroke="#d0d7de"/><g fill="#1c7ed6"><rect x="10" y="24" width="14" height="14" rx="3"/><rect x="30" y="24" width="14" height="14" rx="3"/><rect x="50" y="24" width="14" height="14" rx="3"/><rect x="70" y="24" width="8" height="14" rx="3"/><rect x="10" y="46" width="14" height="14" rx="3"/><rect x="30" y="46" width="14" height="14" rx="3"/></g><g fill="#fff" stroke="#9aa4b2" stroke-dasharray="3 2"><rect x="50" y="46" width="14" height="14" rx="3"/><rect x="70" y="46" width="8" height="14" rx="3"/></g></g>
    <g transform="translate(98,0)"><text x="44" y="0" text-anchor="middle" font-size="9.5" font-weight="700" fill="#1f2328">node-b · 6/8</text><rect x="0" y="12" width="88" height="72" rx="8" fill="#fff" stroke="#d0d7de"/><g fill="#1c7ed6"><rect x="10" y="24" width="14" height="14" rx="3"/><rect x="30" y="24" width="14" height="14" rx="3"/><rect x="50" y="24" width="14" height="14" rx="3"/><rect x="70" y="24" width="8" height="14" rx="3"/><rect x="10" y="46" width="14" height="14" rx="3"/><rect x="30" y="46" width="14" height="14" rx="3"/></g><g fill="#fff" stroke="#9aa4b2" stroke-dasharray="3 2"><rect x="50" y="46" width="14" height="14" rx="3"/><rect x="70" y="46" width="8" height="14" rx="3"/></g></g>
    <g transform="translate(196,0)"><text x="44" y="0" text-anchor="middle" font-size="9.5" font-weight="700" fill="#1f2328">node-c · 6/8</text><rect x="0" y="12" width="88" height="72" rx="8" fill="#fff" stroke="#d0d7de"/><g fill="#1c7ed6"><rect x="10" y="24" width="14" height="14" rx="3"/><rect x="30" y="24" width="14" height="14" rx="3"/><rect x="50" y="24" width="14" height="14" rx="3"/><rect x="70" y="24" width="8" height="14" rx="3"/><rect x="10" y="46" width="14" height="14" rx="3"/><rect x="30" y="46" width="14" height="14" rx="3"/></g><g fill="#fff" stroke="#9aa4b2" stroke-dasharray="3 2"><rect x="50" y="46" width="14" height="14" rx="3"/><rect x="70" y="46" width="8" height="14" rx="3"/></g></g>
    <g transform="translate(294,0)"><text x="44" y="0" text-anchor="middle" font-size="9.5" font-weight="700" fill="#1f2328">node-d · 6/8</text><rect x="0" y="12" width="88" height="72" rx="8" fill="#fff" stroke="#d0d7de"/><g fill="#1c7ed6"><rect x="10" y="24" width="14" height="14" rx="3"/><rect x="30" y="24" width="14" height="14" rx="3"/><rect x="50" y="24" width="14" height="14" rx="3"/><rect x="70" y="24" width="8" height="14" rx="3"/><rect x="10" y="46" width="14" height="14" rx="3"/><rect x="30" y="46" width="14" height="14" rx="3"/></g><g fill="#fff" stroke="#9aa4b2" stroke-dasharray="3 2"><rect x="50" y="46" width="14" height="14" rx="3"/><rect x="70" y="46" width="8" height="14" rx="3"/></g></g>
  </g>
  <rect x="56" y="270" width="380" height="38" rx="8" fill="#fff1f0" stroke="#e03131"/>
  <text x="246" y="294" text-anchor="middle" font-size="11" font-weight="700" fill="#e03131">可承接 8 卡任务：0 个</text>

  <path d="M472,208 L544,208" fill="none" stroke="#1c7ed6" stroke-width="3" marker-end="url(#a)"/>
  <text x="508" y="184" text-anchor="middle" font-size="11" font-weight="700" fill="#1c7ed6">Repack</text>
  <text x="508" y="233" text-anchor="middle" font-size="9.5" fill="#57606a">拢紧可移动负载</text>

  <rect x="560" y="90" width="524" height="238" rx="12" fill="#edf9f1" stroke="#2f9e44"/>
  <text x="580" y="120" font-size="13" font-weight="700" fill="#1f2328">整理后 · 同样空闲 8 卡，形成 1 台完整节点</text>
  <text x="580" y="141" font-size="10" fill="#57606a">三个节点装满，node-d 的目标资源全部释放</text>
  <g transform="translate(580,164)">
    <g><text x="44" y="0" text-anchor="middle" font-size="9.5" font-weight="700" fill="#1f2328">node-a · 8/8</text><rect x="0" y="12" width="88" height="72" rx="8" fill="#fff" stroke="#2f9e44"/><g fill="#1c7ed6"><rect x="10" y="24" width="14" height="14" rx="3"/><rect x="30" y="24" width="14" height="14" rx="3"/><rect x="50" y="24" width="14" height="14" rx="3"/><rect x="70" y="24" width="8" height="14" rx="3"/><rect x="10" y="46" width="14" height="14" rx="3"/><rect x="30" y="46" width="14" height="14" rx="3"/><rect x="50" y="46" width="14" height="14" rx="3"/><rect x="70" y="46" width="8" height="14" rx="3"/></g></g>
    <g transform="translate(104,0)"><text x="44" y="0" text-anchor="middle" font-size="9.5" font-weight="700" fill="#1f2328">node-b · 8/8</text><rect x="0" y="12" width="88" height="72" rx="8" fill="#fff" stroke="#2f9e44"/><g fill="#1c7ed6"><rect x="10" y="24" width="14" height="14" rx="3"/><rect x="30" y="24" width="14" height="14" rx="3"/><rect x="50" y="24" width="14" height="14" rx="3"/><rect x="70" y="24" width="8" height="14" rx="3"/><rect x="10" y="46" width="14" height="14" rx="3"/><rect x="30" y="46" width="14" height="14" rx="3"/><rect x="50" y="46" width="14" height="14" rx="3"/><rect x="70" y="46" width="8" height="14" rx="3"/></g></g>
    <g transform="translate(208,0)"><text x="44" y="0" text-anchor="middle" font-size="9.5" font-weight="700" fill="#1f2328">node-c · 8/8</text><rect x="0" y="12" width="88" height="72" rx="8" fill="#fff" stroke="#2f9e44"/><g fill="#1c7ed6"><rect x="10" y="24" width="14" height="14" rx="3"/><rect x="30" y="24" width="14" height="14" rx="3"/><rect x="50" y="24" width="14" height="14" rx="3"/><rect x="70" y="24" width="8" height="14" rx="3"/><rect x="10" y="46" width="14" height="14" rx="3"/><rect x="30" y="46" width="14" height="14" rx="3"/><rect x="50" y="46" width="14" height="14" rx="3"/><rect x="70" y="46" width="8" height="14" rx="3"/></g></g>
    <g transform="translate(324,0)"><text x="44" y="0" text-anchor="middle" font-size="9.5" font-weight="700" fill="#2f9e44">node-d · 0/8</text><rect x="0" y="12" width="88" height="72" rx="8" fill="#fff" stroke="#2f9e44" stroke-width="2"/><g fill="#fff" stroke="#2f9e44" stroke-dasharray="3 2"><rect x="10" y="24" width="14" height="14" rx="3"/><rect x="30" y="24" width="14" height="14" rx="3"/><rect x="50" y="24" width="14" height="14" rx="3"/><rect x="70" y="24" width="8" height="14" rx="3"/><rect x="10" y="46" width="14" height="14" rx="3"/><rect x="30" y="46" width="14" height="14" rx="3"/><rect x="50" y="46" width="14" height="14" rx="3"/><rect x="70" y="46" width="8" height="14" rx="3"/></g></g>
  </g>
  <rect x="580" y="270" width="484" height="38" rx="8" fill="#fff" stroke="#2f9e44"/>
  <text x="822" y="294" text-anchor="middle" font-size="11" font-weight="700" fill="#2f9e44">可承接 8 卡任务：1 个 · 也可作为缩容节点</text>
  <rect x="136" y="354" width="848" height="38" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="560" y="378" text-anchor="middle" font-size="10.5" fill="#1f2328">物理卡总数不变、空闲卡总数不变；真正提升的是“能够满足业务资源规格的可调度容量”。</text>
</svg>
