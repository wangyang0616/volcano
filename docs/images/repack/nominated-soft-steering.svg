<svg viewBox="0 0 1120 460" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'PingFang SC','Microsoft YaHei',sans-serif" role="img">
  <title>Repack 使用 nominatedNodeName 为重建 Pod 提供候选节点建议</title>
  <desc>Repack 在驱逐后识别重建 Pod，为其写入候选节点 nominatedNodeName。Volcano Scheduler 在候选节点仍可行时优先评估该节点；若实时状态变化，可以选择其他节点，并将实际绑定节点记录在 RepackRun。</desc>
  <defs>
    <marker id="blue" markerWidth="10" markerHeight="10" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#1c7ed6"/></marker>
    <marker id="green" markerWidth="10" markerHeight="10" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#2f9e44"/></marker>
    <marker id="purple" markerWidth="10" markerHeight="10" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#8b5cf6"/></marker>
  </defs>
  <rect width="1120" height="460" fill="#fff"/>
  <text x="32" y="32" font-size="17" font-weight="700" fill="#1f2328">nominatedNodeName：提供候选节点建议，不替代 Scheduler 决策</text>
  <text x="32" y="56" font-size="11" fill="#57606a">Repack 不预留资源或强制绑定；重建 Pod 的最终节点仍由 Volcano Scheduler 根据实时状态决定。</text>

  <rect x="36" y="104" width="178" height="124" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="125" y="132" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2328">1. 计划并驱逐</text>
  <text x="54" y="158" font-size="10" fill="#57606a">计划：pod-0</text>
  <text x="54" y="176" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="#1f2328">node-a → node-b</text>
  <rect x="54" y="190" width="48" height="18" rx="4" fill="#e03131"/><text x="78" y="203" text-anchor="middle" font-size="8" font-weight="700" fill="#fff">Evict</text>
  <text x="112" y="203" font-size="9" fill="#57606a">持久化 relocation</text>

  <path d="M224,166 L292,166" fill="none" stroke="#1c7ed6" stroke-width="2" marker-end="url(#blue)"/>
  <rect x="304" y="104" width="194" height="124" rx="10" fill="#eaf4ff" stroke="#1c7ed6"/>
  <text x="401" y="132" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2328">2. 重建 Pod 创建</text>
  <text x="322" y="158" font-size="10" fill="#57606a">工作负载控制器创建新 Pod</text>
  <rect x="340" y="174" width="122" height="30" rx="6" fill="#fff" stroke="#1c7ed6"/>
  <text x="401" y="193" text-anchor="middle" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="#1f2328">pod-0-replacement</text>

  <path d="M508,166 L576,166" fill="none" stroke="#1c7ed6" stroke-width="2" marker-end="url(#blue)"/>
  <rect x="588" y="88" width="232" height="156" rx="10" fill="#fff8e8" stroke="#e8890c"/>
  <text x="704" y="118" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2328">3. Volcano Controller Manager</text>
  <text x="606" y="146" font-size="10" fill="#57606a">内置 Repack controller 识别重建 Pod</text>
  <text x="606" y="163" font-size="10" fill="#57606a">基于实时快照选择仍可行的接收节点</text>
  <rect x="606" y="178" width="196" height="39" rx="6" fill="#fff" stroke="#e8890c"/>
  <text x="704" y="195" text-anchor="middle" font-size="9.5" font-family="ui-monospace,Menlo,monospace" fill="#1f2328">status.nominatedNodeName</text>
  <text x="704" y="210" text-anchor="middle" font-size="9.5" font-family="ui-monospace,Menlo,monospace" fill="#1f2328">= node-b</text>

  <path d="M832,166 L888,166" fill="none" stroke="#1c7ed6" stroke-width="2" marker-end="url(#blue)"/>
  <rect x="900" y="104" width="184" height="124" rx="10" fill="#edf9f1" stroke="#2f9e44"/>
  <text x="992" y="132" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2328">4. Scheduler 最终绑定</text>
  <text x="918" y="158" font-size="10" fill="#57606a">优先尝试 node-b</text>
  <text x="918" y="176" font-size="10" fill="#57606a">仍需满足实时资源、亲和性、</text>
  <text x="918" y="193" font-size="10" fill="#57606a">污点、拓扑和设备约束</text>

  <path d="M986,246 L986,284 L678,284 L678,316" fill="none" stroke="#2f9e44" stroke-width="2" marker-end="url(#green)"/>
  <text x="824" y="275" text-anchor="middle" font-size="10" font-weight="700" fill="#2f9e44">建议仍可行：优先调度到 node-b</text>
  <rect x="538" y="330" width="280" height="78" rx="10" fill="#edf9f1" stroke="#2f9e44"/>
  <text x="678" y="356" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2328">调度到建议节点</text>
  <text x="678" y="378" text-anchor="middle" font-size="10" fill="#57606a">selectedNodeName = actualNodeName = node-b</text>
  <text x="678" y="395" text-anchor="middle" font-size="10" fill="#57606a">更容易实现计划中的腾空节点</text>

  <path d="M1020,246 L1020,284 L940,284 L940,316" fill="none" stroke="#8b5cf6" stroke-width="2" marker-end="url(#purple)"/>
  <text x="1007" y="275" text-anchor="middle" font-size="10" font-weight="700" fill="#8b5cf6">实时状态变化</text>
  <rect x="832" y="330" width="256" height="78" rx="10" fill="#f5f0ff" stroke="#8b5cf6"/>
  <text x="960" y="356" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2328">调度到其他节点</text>
  <text x="960" y="378" text-anchor="middle" font-size="10" fill="#57606a">Scheduler 可选择 node-c，避免阻塞 Pod 调度</text>
  <text x="960" y="395" text-anchor="middle" font-size="10" fill="#57606a">actualNodeName=node-c，结果可审计</text>

  <rect x="36" y="330" width="444" height="78" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="56" y="356" font-size="12" font-weight="700" fill="#1f2328">这不是强制绑定，也不是资源预留</text>
  <text x="56" y="378" font-size="10" fill="#57606a">Repack 不设置 cordon、污点或资源预留；释放的容量仍可供调度队列中的其他工作负载使用。</text>
  <text x="56" y="396" font-size="10" fill="#57606a">候选节点不可行时，Scheduler 可继续选择其他满足约束的节点。</text>
</svg>
