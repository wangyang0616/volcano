<svg viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">AI 辅助研发协作模型</title>
  <desc id="desc">技术架构图展示人的决策平面、AI 工程平面、共享工程状态与 Kubernetes 运行环境。</desc>
  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#D7E3EC" stroke-width="1" opacity=".45"/></pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#34506A" flood-opacity=".14"/></filter>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0l8 4-8 4Z" fill="#326CE5"/></marker>
    <marker id="arrow-orange" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0l8 4-8 4Z" fill="#F4511E"/></marker>
  </defs>
  <rect width="1200" height="675" fill="#F7FAFC"/>
  <rect width="1200" height="675" fill="url(#grid)"/>

  <g font-family="Inter,'PingFang SC','Microsoft YaHei',sans-serif">
    <text x="54" y="58" fill="#172B3A" font-size="25" font-weight="700">AI 辅助研发协作模型</text>
    <text x="54" y="87" fill="#62798A" font-size="13.5">AI 参与完整研发链路，但架构方向、范围边界和验收标准始终由我控制</text>
    <g transform="translate(1051 39) rotate(45)" fill="#F4511E"><rect width="13" height="13"/><rect x="18" width="13" height="13"/><rect x="9" y="18" width="13" height="13"/></g>
    <text x="1137" y="64" fill="#243B4B" font-size="12" font-weight="700" text-anchor="end">VOLCANO PRACTICE</text>
  </g>

  <!-- Human decision plane -->
  <g transform="translate(54 120)" font-family="Inter,'PingFang SC','Microsoft YaHei',sans-serif" filter="url(#shadow)">
    <rect width="744" height="154" rx="8" fill="#FFFFFF" stroke="#E3B197"/>
    <rect width="744" height="37" rx="8" fill="#FFF1EA"/>
    <rect y="29" width="744" height="8" fill="#FFF1EA"/>
    <rect width="7" height="154" rx="3.5" fill="#F4511E"/>
    <text x="24" y="25" fill="#84391F" font-size="12" font-weight="700" letter-spacing="1">HUMAN DECISION PLANE</text>

    <g transform="translate(24 58)">
      <rect width="212" height="70" rx="6" fill="#FFFAF7" stroke="#F0D2C3"/>
      <circle cx="28" cy="25" r="11" fill="#F4511E"/>
      <path d="M23 25h10M28 20v10" stroke="#FFF" stroke-width="2"/>
      <text x="50" y="29" fill="#522E21" font-size="13" font-weight="700">Goal</text>
      <text x="18" y="54" fill="#8A6659" font-size="11">什么问题值得解决</text>

      <rect x="242" width="212" height="70" rx="6" fill="#FFFAF7" stroke="#F0D2C3"/>
      <circle cx="270" cy="25" r="11" fill="#F4511E"/>
      <path d="M264 20h12v10h-12Z" fill="none" stroke="#FFF" stroke-width="2"/>
      <text x="292" y="29" fill="#522E21" font-size="13" font-weight="700">Boundary</text>
      <text x="260" y="54" fill="#8A6659" font-size="11">当前版本做什么、不做什么</text>

      <rect x="484" width="212" height="70" rx="6" fill="#FFFAF7" stroke="#F0D2C3"/>
      <circle cx="512" cy="25" r="11" fill="#F4511E"/>
      <path d="M506 25l4 4 8-9" fill="none" stroke="#FFF" stroke-width="2" stroke-linecap="round"/>
      <text x="534" y="29" fill="#522E21" font-size="13" font-weight="700">Acceptance</text>
      <text x="502" y="54" fill="#8A6659" font-size="11">什么证据能够证明完成</text>
    </g>
  </g>

  <!-- AI engineering plane -->
  <g transform="translate(54 302)" font-family="Inter,'PingFang SC','Microsoft YaHei',sans-serif" filter="url(#shadow)">
    <rect width="744" height="194" rx="8" fill="#FFFFFF" stroke="#9CC4E8"/>
    <rect width="744" height="37" rx="8" fill="#EAF5FF"/>
    <rect y="29" width="744" height="8" fill="#EAF5FF"/>
    <rect width="7" height="194" rx="3.5" fill="#326CE5"/>
    <text x="24" y="25" fill="#205A92" font-size="12" font-weight="700" letter-spacing="1">AI ENGINEERING PLANE</text>

    <g transform="translate(24 57)">
      <g>
        <rect width="158" height="106" rx="6" fill="#F7FBFF" stroke="#C7DEEF"/>
        <text x="16" y="25" fill="#245B8A" font-size="12" font-weight="700">01 · CONTEXT</text>
        <path d="M16 43h108M16 58h84M16 73h116" stroke="#8AB9DC" stroke-width="5" stroke-linecap="round" opacity=".55"/>
        <text x="16" y="95" fill="#6A879D" font-size="10.5">代码 · 文档 · Git 历史</text>
      </g>
      <g transform="translate(172)">
        <rect width="158" height="106" rx="6" fill="#F7FBFF" stroke="#C7DEEF"/>
        <text x="16" y="25" fill="#245B8A" font-size="12" font-weight="700">02 · DESIGN</text>
        <rect x="16" y="40" width="32" height="24" rx="3" fill="#DBEEFC"/><rect x="63" y="40" width="32" height="24" rx="3" fill="#C7E4F8"/><rect x="110" y="40" width="32" height="24" rx="3" fill="#A9D5F2"/>
        <path d="M48 52h15M95 52h15" stroke="#326CE5" stroke-width="2"/>
        <text x="16" y="95" fill="#6A879D" font-size="10.5">方案 · 接口 · 状态机</text>
      </g>
      <g transform="translate(344)">
        <rect width="158" height="106" rx="6" fill="#F7FBFF" stroke="#C7DEEF"/>
        <text x="16" y="25" fill="#245B8A" font-size="12" font-weight="700">03 · BUILD</text>
        <rect x="16" y="40" width="126" height="35" rx="4" fill="#173B5D"/>
        <text x="28" y="62" fill="#7AD0FF" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11">{ code + test }</text>
        <text x="16" y="95" fill="#6A879D" font-size="10.5">跨模块实现与配套修改</text>
      </g>
      <g transform="translate(516)">
        <rect width="180" height="106" rx="6" fill="#F7FBFF" stroke="#C7DEEF"/>
        <text x="16" y="25" fill="#245B8A" font-size="12" font-weight="700">04 · REVIEW</text>
        <circle cx="35" cy="57" r="17" fill="#DCEEFF"/>
        <path d="M27 57l6 6 12-14" fill="none" stroke="#326CE5" stroke-width="4" stroke-linecap="round"/>
        <text x="62" y="53" fill="#42657E" font-size="10.5">正确性 · 并发</text>
        <text x="62" y="69" fill="#42657E" font-size="10.5">一致性 · 复杂度</text>
        <text x="16" y="95" fill="#6A879D" font-size="10.5">系统化检视与收敛</text>
      </g>
    </g>
  </g>

  <!-- shared state -->
  <g transform="translate(836 120)" font-family="Inter,'PingFang SC','Microsoft YaHei',sans-serif" filter="url(#shadow)">
    <rect width="310" height="376" rx="8" fill="#FFFFFF" stroke="#B7C7D3"/>
    <rect width="310" height="37" rx="8" fill="#EEF2F5"/>
    <rect y="29" width="310" height="8" fill="#EEF2F5"/>
    <text x="18" y="25" fill="#405668" font-size="12" font-weight="700" letter-spacing="1">SHARED ENGINEERING STATE</text>

    <g transform="translate(20 58)">
      <rect width="270" height="55" rx="5" fill="#F8FAFC" stroke="#D5E0E8"/>
      <rect x="14" y="14" width="28" height="28" rx="4" fill="#263F51"/>
      <path d="M22 20v14M22 27h12M34 27v8" fill="none" stroke="#FFF" stroke-width="2"/>
      <text x="55" y="24" fill="#243B4B" font-size="12" font-weight="700">Git Repository</text>
      <text x="55" y="41" fill="#738797" font-size="10">当前代码与提交历史是事实来源</text>

      <rect y="70" width="270" height="55" rx="5" fill="#F8FAFC" stroke="#D5E0E8"/>
      <rect x="14" y="84" width="28" height="28" rx="4" fill="#326CE5"/>
      <path d="M21 98h14M28 91v14" stroke="#FFF" stroke-width="2"/>
      <text x="55" y="94" fill="#243B4B" font-size="12" font-weight="700">Implementation</text>
      <text x="55" y="111" fill="#738797" font-size="10">API · Engine · Controller · Scheduler</text>

      <rect y="140" width="270" height="55" rx="5" fill="#F8FAFC" stroke="#D5E0E8"/>
      <rect x="14" y="154" width="28" height="28" rx="4" fill="#23A36D"/>
      <path d="M21 168l5 5 10-12" fill="none" stroke="#FFF" stroke-width="2.5" stroke-linecap="round"/>
      <text x="55" y="164" fill="#243B4B" font-size="12" font-weight="700">Evidence</text>
      <text x="55" y="181" fill="#738797" font-size="10">Unit · Race · Benchmark · E2E</text>

      <rect y="210" width="270" height="55" rx="5" fill="#F8FAFC" stroke="#D5E0E8"/>
      <rect x="14" y="224" width="28" height="28" rx="4" fill="#F4511E"/>
      <path d="M21 231h14M21 238h14M21 245h10" stroke="#FFF" stroke-width="2"/>
      <text x="55" y="234" fill="#243B4B" font-size="12" font-weight="700">Documentation</text>
      <text x="55" y="251" fill="#738797" font-size="10">Proposal · Design · User Guide</text>
    </g>

    <rect x="20" y="340" width="270" height="20" rx="4" fill="#E8F3FC"/>
    <rect x="20" y="340" width="231" height="20" rx="4" fill="#326CE5"/>
    <text x="155" y="354" fill="#FFFFFF" font-size="9" font-weight="700" text-anchor="middle">CONTEXT CONTINUITY</text>
  </g>

  <!-- coordination paths -->
  <path d="M424 274v20" stroke="#F4511E" stroke-width="2" marker-end="url(#arrow-orange)"/>
  <path d="M798 195h28" stroke="#8399A9" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <path d="M826 417h-18" stroke="#326CE5" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <!-- runtime foundation -->
  <g transform="translate(54 536)" font-family="Inter,'PingFang SC','Microsoft YaHei',sans-serif">
    <rect width="1092" height="84" rx="7" fill="#0D6DCC"/>
    <g transform="translate(24 20)">
      <path d="M22 0l19 11v22L22 44 3 33V11Z" fill="none" stroke="#FFF" stroke-width="2"/>
      <circle cx="22" cy="22" r="7" fill="none" stroke="#FFF" stroke-width="2"/>
      <path d="M22 7v8M22 29v8M7 22h8M29 22h8" stroke="#FFF" stroke-width="2"/>
    </g>
    <text x="86" y="35" fill="#FFFFFF" font-size="14" font-weight="700">REAL CLUSTER &amp; KUBERNETES API</text>
    <text x="86" y="56" fill="#C3E0FC" font-size="11">运行结果不是 AI 推断出来的，而是由真实对象、调度行为和集群状态验证</text>
    <g transform="translate(738 19)">
      <rect width="98" height="46" rx="5" fill="#FFFFFF" opacity=".13"/>
      <text x="49" y="21" fill="#FFFFFF" font-size="10" text-anchor="middle">DRYRUN</text><text x="49" y="36" fill="#CDE5FA" font-size="9" text-anchor="middle">PLAN</text>
      <rect x="110" width="98" height="46" rx="5" fill="#FFFFFF" opacity=".13"/>
      <text x="159" y="21" fill="#FFFFFF" font-size="10" text-anchor="middle">EXECUTE</text><text x="159" y="36" fill="#CDE5FA" font-size="9" text-anchor="middle">ACTION</text>
      <rect x="220" width="98" height="46" rx="5" fill="#FFFFFF" opacity=".22"/>
      <text x="269" y="21" fill="#FFFFFF" font-size="10" font-weight="700" text-anchor="middle">VERIFY</text><text x="269" y="36" fill="#FFFFFF" font-size="9" text-anchor="middle">RESULT</text>
    </g>
  </g>
</svg>
