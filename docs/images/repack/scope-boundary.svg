<svg viewBox="0 0 1120 420" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'PingFang SC','Microsoft YaHei',sans-serif" role="img">
  <title>Scope 分别限定允许被驱逐的工作负载和可腾空节点</title>
  <desc>Scope 的 PodGroup 维度通过继承自工作负载的标签选择允许被驱逐的工作负载，Node 维度在提供目标资源的节点中进一步限定可作为腾空目标的节点池或节点集合。受保护的工作负载通过 exclude 排除，接收节点不受 scope.nodes 限制，但仍必须满足工作负载自身调度约束。</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#1c7ed6"/></marker></defs>
  <rect width="1120" height="420" fill="#fff"/>
  <text x="32" y="32" font-size="17" font-weight="700" fill="#1f2328">Scope：限定工作负载驱逐范围和可腾空节点范围</text>
  <text x="32" y="56" font-size="11" fill="#57606a">两个选择轴彼此独立；工作负载和节点同时满足范围条件时，Pod 才可能进入候选计划。</text>

  <rect x="36" y="88" width="300" height="244" rx="12" fill="#eaf4ff" stroke="#1c7ed6"/>
  <text x="56" y="118" font-size="13" font-weight="700" fill="#1f2328">① 工作负载轴 · scope.podGroups</text>
  <text x="56" y="140" font-size="10" fill="#57606a">匹配自动继承到 PodGroup 的工作负载标签</text>
  <rect x="58" y="160" width="256" height="48" rx="8" fill="#edf9f1" stroke="#2f9e44"/>
  <circle cx="78" cy="184" r="9" fill="#2f9e44"/><text x="78" y="188" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">✓</text>
  <text x="96" y="180" font-size="10.5" font-weight="700" fill="#1f2328">batch-train / offline-infer</text>
  <text x="96" y="197" font-size="9.5" fill="#57606a">eligible=true · 允许驱逐</text>
  <rect x="58" y="220" width="256" height="48" rx="8" fill="#fff1f0" stroke="#e03131" stroke-dasharray="5 3"/>
  <circle cx="78" cy="244" r="9" fill="#e03131"/><text x="78" y="248" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">×</text>
  <text x="96" y="240" font-size="10.5" font-weight="700" fill="#1f2328">online-critical</text>
  <text x="96" y="257" font-size="9.5" fill="#57606a">protected=true · exclude</text>
  <text x="58" y="300" font-size="10" fill="#1c7ed6">用户维护工作负载标签，无需追踪自动生成的 PodGroup 名称</text>

  <rect x="410" y="88" width="300" height="244" rx="12" fill="#fff8e8" stroke="#e8890c"/>
  <text x="430" y="118" font-size="13" font-weight="700" fill="#1f2328">② 节点轴 · scope.nodes</text>
  <text x="430" y="140" font-size="10" fill="#57606a">在目标资源节点中进一步限定节点池</text>
  <rect x="432" y="160" width="256" height="108" rx="8" fill="#fff" stroke="#e8890c"/>
  <text x="450" y="183" font-size="10.5" font-weight="700" fill="#1f2328">accelerator-pool=ascend-npu</text>
  <g transform="translate(450,201)"><rect width="48" height="36" rx="6" fill="#fff8e8" stroke="#e8890c"/><rect x="58" width="48" height="36" rx="6" fill="#fff8e8" stroke="#e8890c"/><rect x="116" width="48" height="36" rx="6" fill="#fff8e8" stroke="#e8890c"/><rect x="174" width="48" height="36" rx="6" fill="#fff1f0" stroke="#e03131" stroke-dasharray="4 3"/><text x="24" y="23" text-anchor="middle" font-size="9" fill="#1f2328">node-a</text><text x="82" y="23" text-anchor="middle" font-size="9" fill="#1f2328">node-b</text><text x="140" y="23" text-anchor="middle" font-size="9" fill="#1f2328">node-c</text><text x="198" y="23" text-anchor="middle" font-size="9" fill="#e03131">exclude</text></g>
  <text x="432" y="290" font-size="10" fill="#57606a">范围外节点不会被腾空，但可作为接收节点。</text>
  <text x="432" y="307" font-size="10" fill="#57606a">需要限制候选节点时，应配置工作负载自身的调度约束。</text>

  <path d="M348,210 L392,210" fill="none" stroke="#1c7ed6" stroke-width="2" marker-end="url(#a)"/>
  <path d="M722,210 L766,210" fill="none" stroke="#1c7ed6" stroke-width="2" marker-end="url(#a)"/>
  <rect x="780" y="88" width="304" height="244" rx="12" fill="#edf9f1" stroke="#2f9e44"/>
  <text x="800" y="118" font-size="13" font-weight="700" fill="#1f2328">③ 两个轴取交集形成候选 Pod</text>
  <rect x="802" y="154" width="260" height="76" rx="9" fill="#fff" stroke="#2f9e44"/>
  <text x="932" y="180" text-anchor="middle" font-size="11" font-weight="700" fill="#2f9e44">允许驱逐的工作负载 ∩ 可腾空节点</text>
  <text x="932" y="201" text-anchor="middle" font-size="10" fill="#57606a">才会进入节点腾空与迁移模拟</text>
  <text x="932" y="218" text-anchor="middle" font-size="10" fill="#57606a">任一侧未命中，都不会成为本次 victim</text>
  <rect x="802" y="248" width="260" height="54" rx="9" fill="#fff" stroke="#d0d7de"/>
  <text x="932" y="271" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1f2328">结果：从小范围开始执行</text>
  <text x="932" y="289" text-anchor="middle" font-size="9.5" fill="#57606a">受保护的工作负载和范围外节点不参与整理</text>
  <rect x="180" y="360" width="760" height="34" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="560" y="382" text-anchor="middle" font-size="10.5" fill="#1f2328">Scope 限定工作负载驱逐范围和可腾空节点；maxPerRun 继续限制单次影响规模。</text>
</svg>
